<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Mi pileta · José Carrizo e Hijos</title>
<link rel="manifest" href="cliente.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0B2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi pileta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Inter+Tight:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--navy2:#13315C;--blue:#1F63E8;--ink:#1d1d1f;--g50:#f5f5f7;--g200:#e0e0e0;--g300:#f0f0f0;--g600:#6e6e73;--ok:#05A357;--warn:#B45309;
  --grad:linear-gradient(135deg,#0B2545 0%,#1b4a86 100%);--soft:linear-gradient(135deg,#d6e3fb 0%,#f0f5fe 100%);--sh:0 8px 24px #0b254514,0 1px 3px #0b25450d;--bg:#F2F6FC}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font:400 17px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);display:flex;flex-direction:column;letter-spacing:-.374px;-webkit-font-smoothing:antialiased}
b,strong{font-weight:600}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;letter-spacing:inherit}
input,select,textarea{font:inherit;font-size:17px;color:var(--ink);width:100%;padding:12px 14px;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 1px #0b25451a;margin:6px 0 14px;-webkit-appearance:none;appearance:none}
input:focus,select:focus,textarea:focus{outline:2px solid var(--navy);outline-offset:0}
:focus-visible{outline:2px solid var(--navy);outline-offset:2px}
label{display:block;font-weight:600;font-size:14px;letter-spacing:-.224px;color:var(--g600)}
h1{font-family:'Inter Tight',-apple-system,system-ui,sans-serif;font-size:38px;line-height:1.02;font-weight:500;letter-spacing:-.05em;margin-bottom:8px;color:#071B45}
h1 em,.hl{display:inline-block;background:#071B45;color:#fff;padding:0 .18em .06em;border-radius:.16em;font-style:italic;font-weight:400;transform:rotate(-2deg)}
h2{font-size:26px;line-height:1.15;font-weight:600;margin-bottom:4px}
h3{font-size:14px;font-weight:600;letter-spacing:-.224px;color:var(--g600);margin:24px 0 10px}
.sub{color:var(--g600);font-size:14px;line-height:1.43;letter-spacing:-.224px;margin-bottom:14px}
.note{background:var(--soft);color:#3b4a63;border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.43;letter-spacing:-.224px;margin-bottom:14px}
.wrap{max-width:640px;margin:0 auto}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 22px) 18px 120px}
.view.on{display:block}
.btn{display:flex;align-items:center;justify-content:center;height:50px;width:100%;border-radius:9999px;background:var(--grad);color:#fff;font-size:17px;text-decoration:none;margin-top:10px;transition:transform .12s,filter .12s}
.btn:active{transform:scale(.97);filter:brightness(1.15)}
.btn.sec{background:transparent;color:var(--navy);box-shadow:inset 0 0 0 1px var(--navy)}
.btn.sm{height:36px;width:auto;padding:0 16px;font-size:14px;letter-spacing:-.224px;margin:0}
.btn.wa{background:#1FA855}
.btn:disabled{opacity:.45}
.card{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:16px;margin-bottom:12px}
.row{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px;width:100%;text-align:left}
.panel .row{background:var(--g50);box-shadow:none}
.grow{flex:1;min-width:0}
.grow b{display:block}
.grow small{display:block;color:var(--g600);font-size:14px;line-height:1.43;letter-spacing:-.224px}
small.u{color:var(--warn)!important}small.a{color:var(--ok)!important}
.num{text-align:right;flex:none}.num b{font-size:16px}.num small{display:block;font-size:12px;color:var(--g600)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:12px 0}
.stats div{background:var(--soft);border-radius:20px;padding:14px 16px;box-shadow:var(--sh);min-height:84px;display:flex;flex-direction:column;justify-content:space-between}
.stats div:nth-child(4n+1),.stats div:nth-child(4n+4){background:var(--grad);color:#fff}
.stats div:nth-child(4n+1) small,.stats div:nth-child(4n+4) small{color:#c3d2ee}
.stats small{display:block;color:var(--g600);font-size:12px;letter-spacing:-.12px}
.stats b{display:block;font-size:21px;line-height:1.2}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:9999px;background:#fff;box-shadow:inset 0 0 0 1px var(--g200);font-weight:600;font-size:14px;letter-spacing:-.224px}
.chip:active{transform:scale(.96)}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;cursor:pointer}
.tag{display:inline-block;font-size:12px;font-weight:600;border-radius:9999px;padding:2px 10px;background:var(--g50);color:var(--g600)}
.tag.nuevo{background:#FEF3C7;color:#92400E}.tag.confirmado{background:#DBEAFE;color:#1E40AF}.tag.entregado{background:#DCFCE7;color:#166534}.tag.cancelado{background:#F3F4F6;color:#6B7280}

/* Inicio */
.hola{font-size:15px;font-weight:600;color:var(--g600)}
.hero{position:relative;border-radius:24px;overflow:hidden;aspect-ratio:4/3;background:linear-gradient(160deg,#0B2545,#1F63E8 60%,#8CC8FF);margin:14px 0 12px;width:100%;display:block;padding:0;box-shadow:var(--sh)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero .cap{position:absolute;left:12px;bottom:12px;right:12px;background:#0b2545cc;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;border-radius:14px;padding:10px 14px;font-size:13px;text-align:left}
.hero .cap b{display:block;font-size:15px}
.hero .empty{position:absolute;inset:0;display:grid;place-items:center;color:#fff;text-align:center;padding:24px;font-weight:600}
.hero .empty span{display:block;font-size:44px;margin-bottom:6px}
.estado{display:flex;gap:12px;align-items:center;border-radius:18px;padding:14px 16px;margin-bottom:12px;background:#fff;box-shadow:var(--sh)}
.estado.ok{background:#E7F7EF;color:#05603A;box-shadow:none}
.estado.warn{background:#FFF7ED;color:#9A3412;box-shadow:none}
.estado .ic{width:42px;height:42px;flex:none;border-radius:50%;display:grid;place-items:center;font-size:20px;font-weight:600;background:#fff;box-shadow:var(--sh)}
.estado b{display:block;font-size:16px}.estado small{display:block;font-size:13px;opacity:.85}
.aviso{border-radius:22px;padding:18px;margin:12px 0;background:var(--grad);color:#fff;box-shadow:0 12px 28px #0b254533}
.aviso small{color:#c3d2ee;display:block;font-size:13px}
.aviso b{display:block;font-family:'Inter Tight',system-ui,sans-serif;font-weight:500;letter-spacing:-.04em;font-size:24px;line-height:1.1;margin:4px 0 12px}
.aviso b .hl{background:#fff;color:#071B45}
.aviso ul{list-style:none;padding:0;margin:0 0 6px}
.aviso li{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #ffffff26;font-size:15px}
.aviso .btn{background:#fff;color:var(--navy)}
.pil{display:flex;gap:12px;align-items:center}
.av{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;font-size:20px;flex:none;background:var(--navy) center/cover no-repeat;box-shadow:var(--sh)}
.av.s{width:36px;height:36px;font-size:15px}

/* Tienda */
.prod{display:flex;gap:12px;align-items:center;background:#fff;border-radius:18px;box-shadow:var(--sh);padding:14px 16px;margin-bottom:10px}
.prod .ico{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-size:22px;background:var(--soft)}
.prod.rec{box-shadow:0 0 0 2px var(--blue),var(--sh)}
.prod .precio{font-weight:600;font-size:16px;white-space:nowrap}
.step{display:flex;align-items:center;gap:6px;margin-top:6px}
.step button{width:34px;height:34px;border-radius:50%;background:var(--g50);font-size:20px;line-height:1;display:grid;place-items:center}
.step button.mas{background:var(--grad);color:#fff}
.step span{min-width:22px;text-align:center;font-weight:600}
.carro{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:700;max-width:616px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--grad);color:#fff;border-radius:9999px;padding:10px 10px 10px 20px;box-shadow:0 12px 30px #0b254559}
.carro .grow small{color:#c3d2ee}
.carro .btn{background:#fff;color:var(--navy);margin:0;width:auto;padding:0 20px;height:42px;font-size:15px}

/* Datos para transferir */
.pago{background:#fff;border-radius:20px;box-shadow:var(--sh);padding:16px;margin:12px 0}
.pago h4{margin:0 0 2px;font-size:16px}
.pago .dato{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--g300)}
.pago .dato:first-of-type{border-top:0}
.pago .dato small{display:block;font-size:12px;color:var(--g600)}
.pago .dato b{display:block;font-size:16px;word-break:break-all}
.pago .cp{flex:none;height:34px;padding:0 14px;border-radius:9999px;background:var(--g50);font-size:13px;font-weight:600}
.pago .cp:active{background:#dfe9fb}
/* Tienda con fotos */
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:6px}
.pcard{background:#fff;border-radius:20px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column}
.pcard.rec{box-shadow:0 0 0 2px var(--blue),var(--sh)}
.pcard img{width:100%;aspect-ratio:1;display:block;object-fit:cover;background:#EAF3FF}
.pcard .pb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.pcard .pb small{font-size:12px;color:var(--g600);line-height:1.3}
.pcard .pb .fila{display:flex;align-items:center;justify-content:space-between;margin-top:auto;gap:6px}
.pcard .precio{font-weight:600;font-size:16px}
.pcard .step{margin:0}
.thumb{width:46px;height:46px;border-radius:12px;object-fit:cover;flex:none}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(3,1fr)}}
/* Chat */
#v-chat{padding:0}
#v-chat.on{display:flex;flex-direction:column}
.chead{display:flex;gap:12px;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 16px 12px;background:#fff;box-shadow:0 1px 0 #0000000f}
.chead b{display:block;font-size:17px}.chead small{display:block;color:var(--g600);font-size:13px}
.msgs{flex:1;overflow:auto;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:80%;padding:10px 12px;border-radius:18px 18px 18px 6px;background:#fff;box-shadow:var(--sh);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.bub.me{align-self:flex-end;background:var(--grad);color:#fff;border-radius:18px 18px 6px 18px}
.bub small{display:block;font-size:11px;opacity:.65;margin-top:4px}
.bub img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-bottom:6px;cursor:pointer}
.dia{align-self:center;font-size:12px;font-weight:600;color:var(--g600);margin:6px 0}
.quick{padding:8px 12px 0}
.cbar{display:flex;gap:8px;align-items:flex-end;padding:4px 12px calc(96px + env(safe-area-inset-bottom))}
.cbar textarea{margin:0;flex:1;resize:none;max-height:120px;border-radius:22px}
.ib{width:46px;height:46px;flex:none;border-radius:50%;background:#fff;box-shadow:var(--sh);display:grid;place-items:center;cursor:pointer}
.ib svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ib.send{background:var(--grad);color:#fff}
.ib input{display:none}
#prev{display:flex;gap:8px;align-items:center;padding:8px 12px 0}
#prev img{width:56px;height:56px;object-fit:cover;border-radius:12px}

nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:800;max-width:616px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);border-radius:28px;background:#ffffffeb;-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);box-shadow:0 10px 30px #0b254526;padding:6px}
nav button{position:relative;padding:8px 0 6px;border-radius:22px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;letter-spacing:-.1px;color:var(--g600)}
nav button.on{background:var(--grad);color:#fff}
nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#D72113;color:#fff;font-size:11px;font-style:normal;display:grid;place-items:center;padding:0 5px;letter-spacing:0}

#auth,#link{flex:1;padding:calc(env(safe-area-inset-top) + 56px) 24px 24px;overflow:auto;background:linear-gradient(160deg,#0B2545 0%,#13315C 55%,#24539b 100%);color:#fff}
#auth>div,#link>div{max-width:440px;margin:0 auto}
.brand{font-size:40px;line-height:1.05;font-weight:600;letter-spacing:-1px;margin-bottom:10px}
#auth .sub,#link .sub{color:#b9c6da;margin-bottom:28px}
#auth input,#link input{box-shadow:none}
#link input#cod{font-size:26px;font-weight:600;letter-spacing:6px;text-align:center;text-transform:uppercase}
#auth .btn,#link .btn{background:#fff;color:var(--navy)}
#auth .btn.sec,#link .btn.sec{background:#ffffff1f;color:#fff;box-shadow:none}
#auth .note,#link .note{background:#ffffff1a;color:#d5deec}
.btn-google{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border-radius:9999px;background:#fff!important;background-image:none!important;color:#1f1f1f!important;border:1px solid #dadce0;font-weight:600;font-size:16px;margin-top:4px}.btn-google:active{transform:scale(.98)}.o-sep{display:flex;align-items:center;gap:10px;margin:16px 0 8px;color:#b9c6da;font-size:13px}.o-sep:before,.o-sep:after{content:"";flex:1;height:1px;background:currentColor;opacity:.4}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#ffffff1a;border-radius:9999px;padding:4px;margin-bottom:18px}
.tabs button{padding:10px;border-radius:9999px;font-weight:600;color:#d5deec}
.tabs button.on{background:#fff;color:var(--navy)}

#sh{position:fixed;inset:0;z-index:1000;display:none}
#sh.on{display:block}
.scrim{position:absolute;inset:0;background:#0b254566}
.panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));max-height:92%;overflow:auto;animation:up .22s ease-out;max-width:660px;margin:0 auto}
.panel img.full{width:100%;border-radius:14px;display:block}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--g200);margin:0 auto 16px}
#toast{position:fixed;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:14px;border-radius:14px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:600;font-size:14px;max-width:560px;margin:0 auto}
#toast.on{opacity:1}
@media (min-width:900px){.stats{grid-template-columns:repeat(4,1fr)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<script src="js/splash.js" data-logo="img/logo-blanco.png" data-equipo="img/equipo-cut.webp"></script>

<section id="auth"><div>
  <div class="brand">José Carrizo<br>e Hijos</div>
  <p class="sub">Seguí el mantenimiento de tu pileta y pedí tus productos desde el celular.</p>
  <div id="authForm"></div>
</div></section>

<section id="link" hidden><div>
  <div class="brand">Vinculá<br>tu pileta</div>
  <p class="sub">Ingresá el código de 6 caracteres que te pasó tu piletero. Lo hacés una sola vez.</p>
  <input id="cod" maxlength="6" autocomplete="off" autocapitalize="characters" placeholder="ABC123">
  <button class="btn" data-a="vincular">Vincular mi pileta</button>
  <p class="note" style="margin-top:18px">¿No tenés el código? Pedíselo a tu piletero o escribinos por WhatsApp al 223 540-5578.</p>
  <button class="btn sec" data-a="salir">Cerrar sesión</button>
</div></section>

<div id="app" hidden>
  <main>
    <section class="view on" id="v-inicio"><div class="wrap" id="inicio"></div></section>
    <section class="view" id="v-tienda"><div class="wrap" id="tienda"></div></section>
    <section class="view" id="v-chat">
      <div class="chead" id="chead"></div>
      <div class="msgs" id="msgs"></div>
      <div class="quick"><div class="chips" id="quick"></div></div>
      <div id="prev" hidden></div>
      <div class="cbar">
        <label class="ib" aria-label="Adjuntar foto"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><input type="file" id="cf" accept="image/*"></label>
        <textarea id="ct" rows="1" placeholder="Escribile a tu piletero…"></textarea>
        <button class="ib send" data-a="enviar" aria-label="Enviar"><svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
      </div>
    </section>
    <section class="view" id="v-hist"><div class="wrap" id="hist"></div></section>
    <section class="view" id="v-cuenta"><div class="wrap" id="cuenta"></div></section>
  </main>
  <div class="carro" id="carro" hidden></div>
  <nav>
    <button data-t="inicio" class="on"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/></svg>Mi pileta</button>
    <button data-t="tienda"><svg viewBox="0 0 24 24"><path d="M5 7h14l-1.2 12.1a1 1 0 01-1 .9H7.2a1 1 0 01-1-.9z"/><path d="M9 10V6a3 3 0 016 0v4"/></svg>Tienda<i class="bdg" id="bdgT" hidden></i></button>
    <button data-t="chat"><svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 01-11.6 7.1L4 20l1-4.6A8 8 0 1121 12z"/></svg>Mensajes<i class="bdg" id="bdg" hidden></i></button>
    <button data-t="hist"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Historial</button>
    <button data-t="cuenta"><svg viewBox="0 0 24 24"><path d="M20 21v-1a5 5 0 00-5-5H9a5 5 0 00-5 5v1"/><circle cx="12" cy="8" r="4"/></svg>Cuenta</button>
  </nav>
</div>

<div id="sh"><div class="scrim" data-a="cerrar"></div><div class="panel"><i class="grab"></i><div id="sheetBody"></div></div></div>
<div id="toast" role="status"></div>

<script src="js/sonidos.js"></script>
<script src="js/push.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// Misma base de datos que la app del equipo
const CFG = { url: 'https://gqromisweyqvdeeahxnl.supabase.co', key: 'sb_publishable_VjJCjpOaEgVfNSDJ7yFotw_HOfE-blF' };
const WHATSAPP = '5492235405578';
let sb = null;
try { sb = CFG.url && window.supabase ? supabase.createClient(CFG.url, CFG.key) : null; } catch (e) { sb = null; }

const Q = new URLSearchParams(location.search);
const C = { d: null, fotos: [], fotosAll: null, ms: [], user: null, foto: null, tab: 'inicio', demo: false, cart: [] };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const peso = n => '$' + Math.round(+n || 0).toLocaleString('es-AR');
const DN = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const hoy = () => ymd(new Date());

async function cargar() {
  if (C.demo) return true;
  const r = await sb.rpc('mi_pileta');
  if (r.error) throw new Error(r.error.message);
  C.d = r.data;
  if (!C.d) return false;
  const f = await sb.rpc('mi_fotos', { p_limite: 6 });
  C.fotos = (!f.error && f.data) || [];
  await cargarMs();
  limpiarCarro();
  return true;
}
async function cargarMs() {
  if (C.demo || !C.d) return;
  const x = await sb.from('mensajes').select().eq('cliente_id', C.d.cliente.id).order('creado', { ascending: true }).limit(300);
  if (!x.error) C.ms = x.data;
}
function proxima() {
  const vs = C.d.visitas || [], hechas = new Set(C.d.realizadas.map(r => r.fecha)), base = fd(hoy());
  for (let i = 0; i < 70; i++) {
    const d = new Date(base); d.setDate(base.getDate() + i);
    const k = ymd(d);
    if (hechas.has(k)) continue;
    const v = vs.filter(v => {
      if ((v.omitir || []).includes(k)) return false;
      const n = Math.round((d - fd(v.fecha)) / 864e5);
      return v.repetir === 'semanal' ? n >= 0 && n % 7 === 0 : v.repetir === 'quincenal' ? n >= 0 && n % 14 === 0 : n === 0;
    }).sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'))[0];
    if (v) return { fecha: k, hora: v.hora };
  }
  return null;
}

    C.cart.map(x => { const it = cat(x.t, x.id); return `<div class="row">${foto(it) ? `<img class="thumb" src="${foto(it)}" alt="">` : ''}<div class="grow"><b>${esc(it.nombre)}</b><small>${peso(it.precio)} c/u</small><div class="step"><button data-a="menosC" data-id="${x.t}:${x.id}">−</button><span>${x.n}</span><button class="mas" data-a="masC" data-id="${x.t}:${x.id}">+</button></div></div><div class="num"><b>${peso(it.precio * x.n)}</b></div></div>`; }).join('') +
    `<div class="stats"><div><small>Total</small><b>${peso(cartTot())}</b></div><div><small>Entrega</small><b style="font-size:16px">Con la próxima visita</b></div></div><label>¿Cómo lo pagás?<select id="pago" onchange="document.getElementById('cobroCarro').hidden=this.value!=='transferencia'">${Object.entries(PAGO).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select></label><div id="cobroCarro" hidden>${tieneCobro(C.d.piletero) ? cobroHTML(C.d.piletero) : '<p class="note">Tu piletero todavía no cargó sus datos para transferir. Pedíselos por Mensajes.</p>'}</div><label>Algo para aclarar (opcional)<input id="pnota" maxlength="300" placeholder="Ej: dejalo en el quincho"></label><button class="btn" data-a="pedir">Enviar pedido</button><button class="btn sec" data-a="cerrar">Seguir comprando</button>`);
}
function renderChatHead() {
  const p = C.d.piletero;
  $('#chead').innerHTML = `${avatar(p, 's')}<div><b>${esc(p?.nombre || 'Tu piletero')}</b><small>José Carrizo e Hijos · te responde apenas pueda</small></div>`;
  $('#quick').innerHTML = QUICK.map(q => `<button class="chip" data-a="rapido" data-id="${esc(q)}">${esc(q)}</button>`).join('');
}
function renderMsgs() {
  const el = $('#msgs'), abajo = el.scrollHeight - el.scrollTop - el.clientHeight < 80;
  let ult = '';
  el.innerHTML = C.ms.length ? C.ms.map(m => {
    const d = new Date(m.creado), k = ymd(d), sep = k !== ult ? `<div class="dia">${k === hoy() ? 'Hoy' : dias(k) === 1 ? 'Ayer' : Largo(k)}</div>` : '';
    ult = k;
    return sep + `<div class="bub ${m.de_cliente ? 'me' : ''}">${m.foto ? `<img src="${esc(m.foto)}" alt="Foto" data-a="verFoto" data-src="${esc(m.foto)}">` : ''}${esc(m.texto || '')}<small>${d.toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' })}</small></div>`;
  }).join('') : '<p class="note" style="align-self:stretch">Escribile a tu piletero: avisos, consultas o una foto de la pileta. Le llega a su app.</p>';
  if (abajo || renderMsgs.first) el.scrollTop = el.scrollHeight;
  renderMsgs.first = false;
}
async function renderHist() {
  const r = C.d.realizadas;
  if (!C.fotosAll) {
    $('#hist').innerHTML = '<h1>Historial</h1><p class="note">Cargando…</p>';
    if (C.demo) C.fotosAll = C.fotos;
    else { const f = await sb.rpc('mi_fotos', { p_limite: 60 }); C.fotosAll = (!f.error && f.data) || C.fotos; }
  }
  const fo = id => C.fotosAll.filter(f => f.realizada_id === id), vs = C.d.ventas;
  $('#hist').innerHTML = `<h1>Tu <em>historial</em></h1><p class="sub">Todas las visitas a tu pileta y los productos que compraste.</p>` +
    '<h3>Visitas</h3>' + (r.length ? r.map(x => `<div class="row" style="align-items:flex-start"><div class="grow"><b>${Largo(x.fecha)}</b><small>${esc(x.piletero || '')}${x.piletero ? ' · ' : ''}${hace(x.fecha)}</small><small style="color:var(--ink);margin-top:4px">${esc(x.nota || 'Mantenimiento de rutina')}</small>${x.productos ? `<small>Productos usados: ${esc(x.productos)}</small>` : ''}${fo(x.id).length ? `<div class="fotos">${fo(x.id).map(f => `<img src="${esc(f.data)}" alt="Foto de la visita" data-a="verFoto" data-src="${esc(f.data)}">`).join('')}</div>` : ''}</div><div class="num"><b>${x.valor ? peso(x.valor) : ''}</b></div></div>`).join('') : '<p class="note">Todavía no hay visitas registradas.</p>') +
    '<h3>Productos comprados</h3>' + (vs.length ? vs.map(v => `<div class="row"><div class="grow"><b>${esc(v.nombre)} ×${v.cantidad}</b><small>${largo(v.fecha)}</small><small class="${v.cobrado === false ? 'u' : 'a'}">${v.cobrado === false ? 'Pendiente de pago' : 'Pagado'}</small></div><div class="num"><b>${peso(v.total)}</b></div></div>`).join('') : '<p class="note">No compraste productos todavía.</p>');
}
function renderCuenta() {
  const c = C.d.cliente, u = C.user || {};
  $('#cuenta').innerHTML = `<h1>Mi <em>cuenta</em></h1><p class="sub">${esc(u.user_metadata?.nombre || u.user_metadata?.full_name || '')}${u.user_metadata?.nombre || u.user_metadata?.full_name ? ' · ' : ''}${esc(u.email || '')}</p>` +
    `<h3>Mi pileta</h3><div class="row"><div class="grow"><b>${esc(c.nombre)}</b><small>${esc(c.direccion)}</small></div></div><div class="row"><div class="grow"><b>Frecuencia</b><small>${esc(c.frecuencia || 'Semanal')}${c.dia && c.dia !== 'Sin día fijo' ? ' · ' + esc(c.dia) : ''}</small></div></div><div class="row"><div class="grow"><b>Valor de cada visita</b><small>${c.valor_visita ? peso(c.valor_visita) : 'A coordinar con tu piletero'}</small></div></div>` +
    cobroHTML(C.d.piletero, 'Datos para transferir a tu piletero') +
    `<p class="note" style="margin-top:14px">¿Algún dato está mal? Avisale a tu piletero por Mensajes y lo corrige.</p>` +
    `<a class="btn wa" target="_blank" rel="noopener" href="https://wa.me/${WHATSAPP}">WhatsApp de la empresa · 223 540-5578</a>` +
    `<h3>Notificaciones</h3><div class="pago" id="pushBox" style="margin-top:0"></div>` +
    `<h3>Tener la app en el celular</h3><p class="note">iPhone: tocá Compartir y elegí “Agregar a inicio”.<br>Android: tocá los tres puntos y elegí “Instalar app” o “Agregar a pantalla principal”.</p>` +
    `<button class="btn sec" data-a="salir">Cerrar sesión</button>`;
  if (window.JCPush) JCPush.montar($('#pushBox'), pushOpc());
}
function badge() {
  const n = C.ms.filter(m => !m.de_cliente && !m.leido_cliente).length, b = $('#bdg');
  b.hidden = !n; b.textContent = n;
}
async function marcarLeidos() {
  if (!C.ms.some(m => !m.de_cliente && !m.leido_cliente)) return;
  C.ms.forEach(m => { if (!m.de_cliente) m.leido_cliente = true; });
  badge();
  if (!C.demo) await sb.rpc('marcar_leidos_cliente');
}
function renderAll() { renderInicio(); renderTienda(); renderChatHead(); renderMsgs(); renderCuenta(); badge(); renderCarro(); if (C.tab === 'hist') renderHist(); }
function go(t) {
  C.tab = t;
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  document.querySelectorAll('.view.on').forEach(v => { if (t !== 'chat') v.scrollTop = 0; });
  if (t === 'chat') { renderMsgs.first = true; renderMsgs(); marcarLeidos(); }
  if (t === 'hist') renderHist();
  renderCarro();
}

// ── Mensajes
function achicar(file, max = 1000) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src); ok(cv.toDataURL('image/jpeg', .7));
    };
    img.onerror = () => no(new Error('No pude leer la foto'));
    img.src = URL.createObjectURL(file);
  });
}
function preview() {
  const p = $('#prev');
  p.hidden = !C.foto;
  p.innerHTML = C.foto ? `<img src="${C.foto}" alt="Foto a enviar"><span class="grow sub" style="margin:0">Foto lista para enviar</span><button class="btn sm sec" data-a="sinFoto">Quitar</button>` : '';
}
async function enviar(texto) {
  texto = (texto ?? $('#ct').value).trim();
  if (!texto && !C.foto) return toast('Escribí un mensaje o adjuntá una foto');
  const row = { cliente_id: C.d.cliente.id, de_cliente: true, texto: texto || null, foto: C.foto || null };
  if (C.demo) {
    C.ms.push({ id: crypto.randomUUID(), creado: new Date().toISOString(), ...row });
    setTimeout(() => { C.ms.push({ id: crypto.randomUUID(), de_cliente: false, texto: '¡Recibido! 👍', creado: new Date().toISOString(), leido_cliente: C.tab === 'chat' }); renderMsgs(); badge(); }, 1800);
  } else {
    const x = await sb.from('mensajes').insert({ ...row, autor_id: C.user.id }).select().single();
    if (x.error) throw new Error('No se pudo enviar: ' + x.error.message);
    C.ms.push(x.data);
  }
  son('envio'); $('#ct').value = ''; $('#ct').style.height = ''; C.foto = null; preview();
  renderMsgs.first = true; renderMsgs();
}

// ── Acceso
let modo = Q.get('c') ? 'crear' : 'entrar';
function authUI() {
  $('#auth').hidden = false; $('#link').hidden = true; $('#app').hidden = true;
  $('#authForm').innerHTML = (sb ? `<div class="tabs"><button class="${modo === 'entrar' ? 'on' : ''}" data-a="modo" data-id="entrar">Ya tengo cuenta</button><button class="${modo === 'crear' ? 'on' : ''}" data-a="modo" data-id="crear">Soy nuevo</button></div>` +
    `<button class="btn-google" data-a="google"><svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.4-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 7.9 3.1l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-7.9l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.4-.4-3.5z"/></svg>${modo === 'crear' ? 'Registrarme con Google' : 'Continuar con Google'}</button><div class="o-sep">o con tu mail</div>` +
    (modo === 'crear' ? '<input id="nm" placeholder="Tu nombre" autocomplete="name">' : '') +
    `<input id="em" type="email" placeholder="Mail" autocomplete="email"><input id="pw" type="password" placeholder="Contraseña${modo === 'crear' ? ' (mínimo 6 caracteres)' : ''}" autocomplete="${modo === 'crear' ? 'new-password' : 'current-password'}">` +
    `<button class="btn" data-a="${modo === 'crear' ? 'registro' : 'login'}">${modo === 'crear' ? 'Crear mi cuenta' : 'Entrar'}</button>` +
    (modo === 'entrar' ? '<button class="btn sec" data-a="olvide">Me olvidé la contraseña</button>' : `<p class="note" style="margin-top:14px">${Q.get('c') ? 'Tu código <b>' + esc(Q.get('c').toUpperCase()) + '</b> ya está cargado: después de crear la cuenta se vincula solo.' : 'Después de crear la cuenta te vamos a pedir el código que te pasó tu piletero.'}</p>`)
    : '<p class="note">No se pudo conectar con el servidor. Revisá tu conexión.</p>') +
    '<button class="btn sec" data-a="demo" style="margin-top:22px">Ver cómo funciona (demo)</button>';
}
const volver = () => location.origin + location.pathname + (Q.get('c') ? '?c=' + encodeURIComponent(Q.get('c')) : '');
async function auth(reg) {
  const email = $('#em').value.trim(), pw = $('#pw').value;
  if (!email || pw.length < 6) return toast('Completá tu mail y una contraseña de al menos 6 caracteres');
  let r;
  if (reg) {
    const nombre = $('#nm').value.trim();
    if (!nombre) return toast('Escribí tu nombre');
    r = await sb.auth.signUp({ email, password: pw, options: { data: { tipo: 'cliente', nombre }, emailRedirectTo: volver() } });
    if (r.error) return toast(/registered|already/i.test(r.error.message) ? 'Ese mail ya tiene cuenta. Entrá con “Ya tengo cuenta”.' : r.error.message);
    if (!r.data.session) return sheet('<h2>Revisá tu mail</h2><p class="sub">Te mandamos un link para confirmar la cuenta. Tocalo y volvé a esta app.</p><button class="btn" data-a="cerrar">Entendido</button>');
  } else {
    r = await sb.auth.signInWithPassword({ email, password: pw });
    if (r.error) return toast(/confirm/i.test(r.error.message) ? 'Primero confirmá tu mail con el link que te mandamos' : 'Mail o contraseña incorrectos');
  }
  start(r.data.user);
}
async function vincular(cod) {
  const r = await sb.rpc('vincular_pileta', { p_codigo: cod });
  if (r.error) throw new Error(r.error.message);
}
async function start(u) {
  C.user = u;
  try { C.cart = JSON.parse(localStorage.getItem('carro') || '[]'); } catch (e) { C.cart = []; }
  let ok;
  try {
    ok = await cargar();
    if (!ok && Q.get('c')) { try { await vincular(Q.get('c')); ok = await cargar(); if (ok) toast('¡Listo! Tu pileta quedó vinculada'); } catch (e) { toast(e.message); } }
  } catch (e) { authUI(); return toast(e.message); }
  if (!ok) { $('#auth').hidden = true; $('#app').hidden = true; $('#link').hidden = false; if (Q.get('c')) $('#cod').value = Q.get('c').toUpperCase().slice(0, 6); return; }
  $('#auth').hidden = true; $('#link').hidden = true; $('#app').hidden = false;
  renderAll(); go(C.tab);
  if (window.JCPush) JCPush.sincronizar(sb, 'cliente');
  if (location.hash) abrirDestino(location.href);
}

// ── Acciones
document.addEventListener('click', e => act(e).catch(err => { son('error'); toast(err.message || 'Algo salió mal'); }));
async function act(e) {
  const t = e.target.closest('[data-a],[data-t]'); if (!t) return;
  const d = t.dataset;
  if (d.t) { if (t.closest('nav')) son('tap'); closeSheet(); return go(d.t); }
  const [tp, ip] = (d.id || '').split(':');
  switch (d.a) {
    case 'modo': modo = d.id; return authUI();
    case 'login': return auth(false);
    case 'registro': return auth(true);
    case 'google': {
      t.disabled = true;
      const r = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: volver() } });
      if (r.error) { t.disabled = false; return toast('No se pudo abrir Google. Probá de nuevo.'); }
      return;
    }
    case 'olvide': {
      const email = $('#em').value.trim();
      if (!email) return toast('Escribí tu mail arriba y tocá de nuevo');
      const r = await sb.auth.resetPasswordForEmail(email, { redirectTo: volver() });
      return toast(r.error ? r.error.message : 'Te mandamos un mail para cambiar la contraseña');
    }
    case 'demo': C.demo = true; demo(); $('#auth').hidden = true; $('#link').hidden = true; $('#app').hidden = false; renderAll(); return go('inicio');
    case 'vincular': {
      const cod = $('#cod').value.trim().toUpperCase();
      if (cod.length < 6) return toast('El código tiene 6 caracteres');
      t.disabled = true;
      try { await vincular(cod); } finally { t.disabled = false; }
      toast('¡Listo! Tu pileta quedó vinculada');
      return start(C.user);
    }
    case 'salir':
      if (C.demo) { C.demo = false; modo = 'entrar'; return authUI(); }
      if (window.JCPush) await JCPush.olvidar(sb);
      return sb.auth.signOut().then(() => { location.href = location.pathname; });
    case 'enviar': t.disabled = true; try { await enviar(); } finally { t.disabled = false; } return;
    case 'rapido': if (C.tab !== 'chat') go('chat'); return enviar(d.id);
    case 'sinFoto': C.foto = null; return preview();
    case 'verFoto': return sheet(`<img class="full" src="${esc(d.src)}" alt="Foto"><button class="btn sec" data-a="cerrar">Cerrar</button>`);
    case 'cerrar': return closeSheet();
    case 'copiar':
      try { await navigator.clipboard.writeText(d.id); son('tap'); toast((d.q || 'Dato') + ' copiado'); }
      catch (err) { toast('Mantené apretado el dato para copiarlo'); }
      return;
    case 'mas': return sumar(tp, ip, 1);
    case 'menos': return sumar(tp, ip, -1);
    case 'masC': sumar(tp, ip, 1); return verCarro();
    case 'menosC': sumar(tp, ip, -1); return verCarro();
    case 'verCarro': return verCarro();
    case 'comprarRecs': {
      let n = 0;
      (C.d.recomendaciones || []).forEach(r => { if (cat(r.t, r.id_item) && !enCarro(r.t, r.id_item)) { C.cart.push({ t: r.t, id: r.id_item, n: r.cantidad }); n++; } });
      guardarCarro(); go('tienda'); renderTienda(); renderCarro();
      if (!n && !C.cart.length) return toast('Esos productos no están a la venta por ahora. Escribile a tu piletero.');
      return verCarro();
    }
    case 'pedir': {
      if (!C.cart.length) return;
      const pago = $('#pago').value, nota = $('#pnota').value.trim() || null;
      t.disabled = true;
      try {
        if (C.demo) {
          const items = C.cart.map(x => { const it = cat(x.t, x.id); return { t: x.t, id: x.id, nombre: it.nombre, precio: it.precio, n: x.n }; });
          C.d.pedidos.unshift({ id: crypto.randomUUID(), items, total: cartTot(), pago, nota, estado: 'nuevo', creado: new Date().toISOString() });
          C.d.recomendaciones = C.d.recomendaciones.filter(r => !C.cart.some(x => x.t === r.t && x.id === r.id_item));
          setTimeout(() => { const p = C.d.pedidos[0]; if (p && p.estado === 'nuevo') { p.estado = 'confirmado'; renderAll(); toast('✅ Tu piletero confirmó el pedido'); } }, 4000);
        } else {
          const r = await sb.rpc('hacer_pedido', { p_items: C.cart.map(x => ({ t: x.t, id: x.id, n: x.n })), p_pago: pago, p_nota: nota });
          if (r.error) throw new Error(r.error.message);
        }
      } finally { t.disabled = false; }
      C.cart = []; guardarCarro(); closeSheet();
      if (!C.demo) await cargar();
      renderAll(); go('tienda');
      son('ok'); return toast('¡Pedido enviado! Tu piletero ya lo puede ver');
    }
    case 'cancelarPed': {
      if (C.demo) { const p = C.d.pedidos.find(x => x.id === d.id); p.estado = 'cancelado'; }
      else { const r = await sb.rpc('cancelar_mi_pedido', { p_id: d.id }); if (r.error) throw new Error(r.error.message); await cargar(); }
      renderAll(); return toast('Pedido cancelado');
    }
  }
}
$('#cf').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { C.foto = await achicar(f); preview(); } catch (err) { toast(err.message); }
});
const ct = $('#ct');
ct.addEventListener('input', () => { ct.style.height = ''; ct.style.height = Math.min(120, ct.scrollHeight) + 'px'; });
ct.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && window.matchMedia('(min-width:900px)').matches) { e.preventDefault(); enviar().catch(err => toast(err.message)); } });
$('#cod').addEventListener('input', e => { e.target.value = e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ''); });

// ── Actualización automática (mensajes, foto nueva, estado de pedidos)
let tick = 0;
setInterval(async () => {
  if (document.hidden || C.demo || !C.d || $('#app').hidden) return;
  tick++;
  try {
    if (C.tab === 'chat' || tick % 4 === 0) {
      const antes = C.ms.length; await cargarMs();
      if (C.ms.length !== antes) { if (C.ms.slice(antes).some(m => !m.de_cliente)) son('plin'); renderMsgs(); if (C.tab === 'chat') marcarLeidos(); }
      badge();
    }
    if (tick % 9 === 0) {
      const est = JSON.stringify((C.d.pedidos || []).map(p => p.estado)), vis = (C.d.realizadas[0] || {}).id;
      await cargar();
      if (JSON.stringify((C.d.pedidos || []).map(p => p.estado)) !== est || (C.d.realizadas[0] || {}).id !== vis) son('plin'); C.fotosAll = null; renderInicio(); renderTienda(); renderCarro(); renderCuenta(); if (C.tab === 'hist') renderHist(); }
  } catch (e) {}
}, 10000);
document.addEventListener('visibilitychange', async () => {
  if (document.hidden || C.demo || !C.d || $('#app').hidden) return;
  try { await cargar(); C.fotosAll = null; renderAll(); if (C.tab === 'chat') marcarLeidos(); } catch (e) {}
});

// ── Arranque
(async () => {
  if (Q.has('demo')) { C.demo = true; demo(); $('#auth').hidden = true; $('#app').hidden = false; renderAll(); return go('inicio'); }
  if (sb) {
    const { data } = await sb.auth.getSession();
    if (data.session) return start(data.session.user);
  }
  authUI();
})();
</script>
