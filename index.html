<script>
// ── Conexión: pegá acá los datos de tu proyecto de Supabase (Settings → API).

const CFG = { url: 'https://gqromisweyqvdeeahxnl.supabase.co', key: 'sb_publishable_VjJCjpOaEgVfNSDJ7yFotw_HOfE-blF' };

const sb = CFG.url ? supabase.createClient(CFG.url, CFG.key) : null;
const COLORS = ['#2563EB', '#0E9F6E', '#F59E0B', '#DB2777', '#7C3AED', '#0891B2'];
const S = { ac: [], adm: [], ap: [], tr: [], ms: [], msg: [], ped: [], rec: [], chat: null, chatFoto: null, p: [], c: [], h: [], v: [], r: [], pg: [], vt: [], fo: [], vcl: null, mov: [], co: {}, vc: {}, pr: [], k: [], inv: 'herr', ctab: 'cli', rc: [], av: [], mgl: [], sol: [], pz: [], aj: {}, eq: [], mg: new Set(), mes: '', me: null, F: null, u: [], sel: '', share: false, modo: 'auto' };

  const rs = S.r.filter(r => (r.fecha || '').startsWith(k)), vs = S.vt.filter(v => (v.fecha || '').startsWith(k)), ps = S.pg.filter(x => (x.fecha || '').startsWith(k));
  const comunes = rs.filter(r => !r.abono), sv = sumar(comunes), acs = S.ac.filter(a => a.mes === k), ab = { n: acs.length, t: acs.reduce((a, x) => a + (+x.monto || 0), 0) }, tp = vs.reduce((a, v) => a + (+v.total || 0), 0), ts = trMes(k), tt = ts.reduce((a, t) => a + (+t.presupuesto || 0), 0);
  return { n: rs.length, piletas: new Set(rs.map(r => r.cliente_id).filter(Boolean)).size, visitas: sv.t, abN: ab.n, abonos: ab.t, abEmp: Math.round(ab.t * (1 - PORC)), prod: tp, trN: ts.length, trab: tt, trEmp: ts.reduce((a, t) => a + empTr(t), 0), total: sv.t + ab.t + tp + tt, emp: sv.emp, pagado: ps.reduce((a, x) => a + (+x.monto || 0), 0) };

const PORC = 0.7, PP = Math.round(PORC * 100); // 70% para el piletero, el resto para la empresa (visitas y trabajos)

  return S.v.filter(v => {

function achicar(file, max = 1000) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src); ok(cv.toDataURL('image/jpeg', .7));
    };
    img.onerror = () => no(new Error('No pude leer la foto'));
    img.src = URL.createObjectURL(file);
  });
}

    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=' + encodeURIComponent(q + ', Mar del Plata'));
    const j = await r.json();
    if (j[0]) return [+j[0].lat, +j[0].lon];
  } catch (e) {}
  return null;
}

function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false, minZoom: 11, maxBounds: [[-38.3, -58.0], [-37.75, -57.25]], maxBoundsViscosity: .8 }).setView([-38.005, -57.55], 13);
  let warned = false;
  const T = (u, a, o = {}) => L.tileLayer(u, { attribution: a, maxZoom: 19, ...o }).on('tileerror', () => { if (!warned) { warned = true; toast('No cargan los mapas. Revisá la conexión a internet.'); } });
  const calles = T('https://tile.openstreetmap.org/{z}/{x}/{y}.png', '© OpenStreetMap').addTo(map);
  const claro = T('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', '© OpenStreetMap © CARTO');
  const sat = T('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Esri', { maxZoom: 18 });
  L.control.layers({ Calles: calles, Claro: claro, Satélite: sat }, null, { position: 'bottomright' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  ulayer = L.layerGroup().addTo(map);
  rlayer = L.layerGroup().addTo(map);
}

// ── Ruta desde donde estoy (auto, moto, bici o a pie)
const PERF = { auto: 'car', moto: 'car', bici: 'bike', pie: 'foot' };
const GMODE = { auto: 'driving', moto: 'two-wheeler', bici: 'bicycling', pie: 'walking' };
const MODOS = { auto: 'Auto', moto: 'Moto', bici: 'Bici', pie: 'A pie' };
let R = null;
const hav = (a, b) => { const r = Math.PI / 180, x = (b[1] - a[1]) * r * Math.cos((a[0] + b[0]) / 2 * r), y = (b[0] - a[0]) * r; return Math.sqrt(x * x + y * y) * 6371; };
function ordenar(origin, stops) {
  const rest = stops.slice(), path = []; let cur = origin;
  while (rest.length) {
    let bi = 0, bd = Infinity;
    rest.forEach((q, i) => { const d = hav(cur, [q.lat, q.lng]); if (d < bd) { bd = d; bi = i; } });
    cur = [rest[bi].lat, rest[bi].lng]; path.push(rest.splice(bi, 1)[0]);
  }
  const pts = [{ lat: origin[0], lng: origin[1] }, ...path], dist = (a, b) => hav([a.lat, a.lng], [b.lat, b.lng]);
  for (let mejora = true, vueltas = 0; mejora && vueltas < 50; vueltas++) {
    mejora = false;
    for (let i = 1; i < pts.length - 1; i++) for (let j = i + 1; j < pts.length; j++) {
      const a = pts[i - 1], b = pts[i], c = pts[j], d = pts[j + 1];
      if (dist(a, c) + (d ? dist(b, d) : 0) < dist(a, b) + (d ? dist(c, d) : 0) - 1e-9) { const seg = pts.slice(i, j + 1).reverse(); pts.splice(i, seg.length, ...seg); mejora = true; }
    }
  }
  return pts.slice(1);
}
async function ruta(stops, titulo, opt = {}) {
  if (!navigator.geolocation) throw new Error('Este dispositivo no tiene GPS');
  toast('Buscando tu ubicación…');
  const pos = await new Promise((ok, no) => navigator.geolocation.getCurrentPosition(ok, no, { enableHighAccuracy: true, timeout: 15000 }))
    .catch(() => { throw new Error('Activá la ubicación para trazar la ruta desde donde estás.'); });
  const multi = !!opt.ordenar && stops.length > 1;
  R = { origin: [pos.coords.latitude, pos.coords.longitude], base: stops, titulo, multi, orden: multi ? 'corto' : 'dado' };
  closeSheet(); go('mapa'); await trazar();
}
async function trazar() {
  if (!R) return;
  R.stops = R.orden === 'corto' ? ordenar(R.origin, R.base) : R.base.slice();
  rlayer.clearLayers(); R.km = R.min = null;
  const pts = [R.origin, ...R.stops.map(x => [x.lat, x.lng])];
  L.circleMarker(R.origin, { radius: 7, color: '#fff', weight: 3, fillColor: '#0B2545', fillOpacity: 1 }).addTo(rlayer);
  if (R.multi) R.stops.forEach((x, i) => L.marker([x.lat, x.lng], { icon: L.divIcon({ className: '', iconSize: [26, 26], iconAnchor: [13, 13], html: `<div class="num-pin">${i + 1}</div>` }) }).addTo(rlayer));
  try {
    const r = await fetch(`https://routing.openstreetmap.de/routed-${PERF[S.modo]}/route/v1/driving/${pts.map(q => q[1] + ',' + q[0]).join(';')}?overview=full&geometries=geojson`).then(x => x.json());
    const rt = r.routes && r.routes[0]; if (!rt) throw 0;
    R.km = rt.distance / 1000; R.min = Math.round(rt.duration / 60);
    L.geoJSON(rt.geometry, { style: { color: '#0B2545', weight: 5, opacity: .85 } }).addTo(rlayer);
  } catch (e) {
    toast('No pude calcular la ruta, pero podés iniciar la navegación.');
    L.polyline(pts, { color: '#0B2545', weight: 3, dashArray: '6 8' }).addTo(rlayer);
  }
  map.fitBounds(L.featureGroup(rlayer.getLayers()).getBounds(), { padding: [70, 70] });
  panelRuta();
}
function gmaps() {
  const last = R.stops[R.stops.length - 1], mid = R.stops.slice(0, -1).map(x => x.lat + ',' + x.lng).join('|');
  return `https://www.google.com/maps/dir/?api=1&destination=${last.lat},${last.lng}${mid ? '&waypoints=' + encodeURIComponent(mid) : ''}&travelmode=${GMODE[S.modo]}&dir_action=navigate`;
}
function panelRuta() {
  const el = $('#ruta');

      try { S.me = await upd('p', 'perfiles', S.me.id, { pago_alias: $('#pgA').value.trim() || null, pago_cbu: cbu || null, pago_titular: $('#pgT').value.trim() || null, pago_banco: $('#pgB').value.trim() || null }) || S.me; }
      finally { t.disabled = false; }
      son('ok'); renderAll(); return toast('Listo. Tus clientes ya ven tus datos para transferir');
    }
    case 'habilitar': {
      if (!isGestor()) return;
      await upd('p', 'perfiles', d.id, { activo: true }); renderAll(); return toast('Cuenta habilitada');
    }
    case 'rechazar': {
      if (!isGestor() || !confirm('¿Rechazar esta cuenta? No va a poder usar la app del equipo.')) return;
      await del('p', 'perfiles', d.id); renderAll(); return toast('Cuenta rechazada');
    }
    case 'pedidos': S.inv = 'ped'; S.pf = 'pend'; closeSheet(); go('inv'); return renderInv();
    case 'pedFiltro': S.pf = d.id; return renderPed();
    case 'nuevoPed': return nuevoPedido();
    case 'npAdd': {
      const [tp, id] = $('#npI').value.split(':'), x = (tp === 'k' ? S.k : S.pr).find(y => y.id === id), n = Math.round(+$('#npN').value || 0);
      if (!x || n < 1 || n > 200) return toast('Poné una cantidad entre 1 y 200');
      const ya = S.carro.find(i => i.t === tp && i.id === id); if (ya) ya.n += n; else S.carro.push({ t: tp, id, nombre: x.nombre, p: precioEf(x), n });
      $('#npN').value = 1; return carroHTML();
    }
    case 'npQuitar': S.carro.splice(+d.id, 1); return carroHTML();
    case 'npGuardar': {
      const cid = $('#npC').value;
      if (!cid) return toast('Elegí el cliente');
      if (!S.carro.length) return toast('Agregá al menos un producto');
      const a = { p_cliente: cid, p_items: S.carro.map(i => ({ t: i.t, id: i.id, n: i.n })), p_pago: $('#npP').value, p_nota: null, p_entrega: $('#npF').value || null, p_lleva: $('#npQ').value || null, p_coord: $('#npK').value.trim() || null };
      t.disabled = true;
      try {
        if (sb) await rpc('pedido_equipo', a);
        else S.ped.unshift({ id: crypto.randomUUID(), cliente_id: cid, items: S.carro.map(i => ({ t: i.t, id: i.id, nombre: i.nombre, precio: i.p, n: i.n })), total: S.carro.reduce((x, i) => x + i.p * i.n, 0), pago: a.p_pago, estado: 'nuevo', origen: 'equipo', creado_por: S.me.id, entrega: a.p_entrega, lleva_id: a.p_lleva, coordinacion: a.p_coord, creado: new Date().toISOString() });
      } catch (e) { t.disabled = false; return toast(e.message); }
      S.inv = 'ped'; S.pf = 'pend'; son('ok'); closeSheet(); go('inv'); renderAll(); return toast('Pedido registrado. Les llegó un aviso a los coordinadores 🧾');
    }
    case 'pedCoord': {
      const pe = S.ped.find(x => x.id === d.id), f = { entrega: $('#pcF').value || null, lleva_id: $('#pcQ').value || null, pago: $('#pcP').value, coordinacion: $('#pcK').value.trim() || null };
      t.disabled = true;
      try {
        if (sb) { await rpc('coordinar_pedido', { p_id: pe.id, p_entrega: f.entrega, p_lleva: f.lleva_id, p_pago: f.pago, p_coord: f.coordinacion }); if (sb) await cargarPortal(true); }
        else Object.assign(pe, f);
      } catch (e) { t.disabled = false; return toast(e.message); }
      son('ok'); renderAll(); verPedido(pe.id); return toast(f.lleva_id && f.lleva_id !== S.me.id ? `Guardado. Le avisamos a ${nom(f.lleva_id)} 🚚` : 'Coordinación guardada');
    }
    case 'verPedido': return verPedido(d.id);
    case 'pedConfirmar': {
      await upd('ped', 'pedidos', d.id, { estado: 'confirmado', atendido_por: S.me.id, actualizado: new Date().toISOString() });
      son('ok'); renderAll(); verPedido(d.id); return toast('Pedido confirmado. El cliente lo ve en su app.');
    }
    case 'pedEntregar': {
      t.disabled = true;
      try { await rpc('entregar_pedido', { p_id: d.id, p_cobrado: $('#pco').value === 'si' }); if (sb) await cargarPortal(true); }
      finally { t.disabled = false; }
      son('ok'); closeSheet(); renderAll(); return toast('Pedido entregado: la venta quedó registrada');
    }
    case 'pedCancelar': {
      if (!confirm('¿Cancelar este pedido? El cliente lo va a ver cancelado.')) return;
      await upd('ped', 'pedidos', d.id, { estado: 'cancelado', atendido_por: S.me.id, actualizado: new Date().toISOString() });
      closeSheet(); renderAll(); return toast('Pedido cancelado');
    }
    case 'chat': return openChat(d.id);
    case 'chatSinFoto': S.chatFoto = null; $('#chatPrev').innerHTML = ''; return;
    case 'chatEnviar': {
      const c = S.c.find(x => x.id === d.id), txt = $('#chatTxt').value.trim();
      if (!txt && !S.chatFoto) return toast('Escribí un mensaje o adjuntá una foto');
      const row = { cliente_id: c.id, de_cliente: false, texto: txt || null, foto: S.chatFoto ? await JCFotos.subir(sb, S.chatFoto, `chat/${c.id}`) : null };
      t.disabled = true;
      try {
        if (sb) { const x = await sb.from('mensajes').insert(row).select().single(); if (x.error) throw new Error(x.error.message); S.ms.push(x.data); }
        else S.ms.push({ id: crypto.randomUUID(), creado: new Date().toISOString(), leido_equipo: true, ...row });
      } finally { t.disabled = false; }
      son('envio'); $('#chatTxt').value = ''; S.chatFoto = null; $('#chatPrev').innerHTML = '';
      const el = $('#chatMsgs'); el.innerHTML = bubbles(S.ms.filter(m => m.cliente_id === c.id), c); el.scrollTop = el.scrollHeight;
      return;
    }
    case 'nuevoCod': {
      const c = S.c.find(x => x.id === d.id);
      if (c.usuario_id && !confirm('El cliente va a dejar de ver su pileta en la app hasta que cargue el código nuevo. ¿Seguir?')) return;
      await upd('c', 'clientes', c.id, { codigo: codNuevo(), usuario_id: null });
      openCliente(c.id); return toast('Código nuevo generado');
    }
    case 'recomendar': return recomendar(d.id);
    case 'okRecomendar': {
      const sel = [...document.querySelectorAll('[data-rq]')].map(i => ({ k: i.dataset.rq, n: Math.floor(+i.value || 0) })).filter(x => x.n > 0);
      if (!sel.length) return toast('Poné la cantidad en al menos un producto');
      const nota = $('#rnota').value.trim() || null;
      t.disabled = true;
      try { for (const x of sel) { const [tipo, item_id] = x.k.split(':'); await put('rec', 'recomendaciones', { cliente_id: d.id, tipo, item_id, cantidad: x.n, nota }); } }
      finally { t.disabled = false; }
      openCliente(d.id); renderAll(); return toast('Listo, el cliente lo ve en su app');
    }
    case 'quitarRec': {
      const r = S.rec.find(x => x.id === d.id);
      await upd('rec', 'recomendaciones', d.id, { estado: 'descartada' }); S.rec = S.rec.filter(x => x.id !== d.id);
      return openCliente(r.cliente_id);
    }
    case 'recSel': return t.classList.toggle('on');
    case 'demo': return start(d.id);
    case 'login': return auth(false);
    case 'registro': return auth(true);
    case 'google': {
      t.disabled = true;
      const r = await sb.auth.signInWithOAuth({ provider: 'google', options: { redirectTo: location.origin + location.pathname } });
      if (r.error) { t.disabled = false; return toast('No se pudo abrir Google. Probá de nuevo.'); }
      return;
    }
    case 'abrir': return openCliente(d.id);
    case 'mio': {
      const c = S.c.find(x => x.id === d.id);
      await put('c', 'clientes', { ...c, piletero_id: S.me.id });
      closeSheet(); renderAll(); return toast('Ahora es tu cliente');
    }
    case 'nuevoC': return formCliente();
    case 'editarC': return formCliente(S.c.find(x => x.id === d.id));
    case 'guardarC': {
      const c = S.c.find(x => x.id === d.id), n = $('#fn').value.trim(), dir = $('#fd').value.trim();
      if (!n || !dir) return toast('Completá nombre y dirección');
      let g = c && dir === c.direccion ? [c.lat, c.lng] : null;
      if (!g) { t.disabled = true; g = await geo(dir); t.disabled = false; }
      if (!g) return toast('No encontré esa dirección. Probá con calle y número.');
      const inst = (document.querySelector('input[name=ctipo]:checked') || {}).value === 'institucion';
      let adm = inst ? $('#fa').value || null : null;
      if (inst && adm === 'nueva') {
        const an = $('#faN').value.trim(); if (!an) return toast('Escribí el nombre de la administración');
        try { const na = sb ? await (async () => { const x = await sb.from('administraciones').insert({ nombre: an, telefono: $('#faT').value.trim() || null }).select().single(); if (x.error) throw new Error(x.error.message); return x.data; })() : { id: crypto.randomUUID(), nombre: an, telefono: $('#faT').value.trim() || null, codigo: 'A' + Math.random().toString(36).slice(2, 8).toUpperCase() }; S.adm.push(na); adm = na.id; }
        catch (e) { return toast(e.message); }
      }
      const ab = inst ? Math.max(+$('#fab').value || 0, 0) : null, vs = inst ? +$('#fvs').value || 1 : null;
      if (inst && !ab) return toast('Poné el abono mensual del edificio');
      const saved = await put('c', 'clientes', { ...c, nombre: n, direccion: dir, lat: g[0], lng: g[1], telefono: $('#fl').value.trim(), tipo: inst ? 'institucion' : 'particular', administracion_id: adm, contacto: inst ? $('#fco').value.trim() || null : null, abono: ab, visitas_semana: vs, valor_visita: inst ? valorAbono(ab, vs) : +$('#fv').value || 0, frecuencia: $('#ff').value, dia: $('#fy').value, notas: $('#ft').value.trim(), piletero_id: $('#fp') ? $('#fp').value : (c?.piletero_id || S.me.id) });
      const dia = $('#fy').value, fr = $('#ff').value;
      if (saved && DN.includes(dia) && (fr === 'Semanal' || fr === 'Cada 15 días') && !S.v.some(v => v.cliente_id === saved.id)) {
        const t2 = new Date(); t2.setDate(t2.getDate() + ((DN.indexOf(dia) - t2.getDay() + 7) % 7));
        await put('v', 'visitas', { cliente_id: saved.id, fecha: ymd(t2), hora: null, repetir: fr === 'Semanal' ? 'semanal' : 'quincenal' });
      }
      closeSheet(); renderAll(); return toast('Cliente guardado');
    }
    case 'borrarC': {
      if (!confirm('¿Eliminar este cliente?')) return;
      if (sb) { const x = await sb.from('clientes').delete().eq('id', d.id); if (x.error) return toast(x.error.message); }
      S.c = S.c.filter(x => x.id !== d.id); S.v = S.v.filter(x => x.cliente_id !== d.id); S.h.forEach(x => { if (x.cliente_id === d.id) x.cliente_id = null; });
      closeSheet(); renderAll(); return toast('Cliente eliminado');
    }
    case 'usar':
      return sheet(`<h2>${esc(h.nombre)}</h2><p class="sub">¿En qué cliente la vas a usar?</p><select id="hc">${optsCli(false, null, 'Sin cliente (la llevo yo)')}</select>${todosCli('hc', 'Sin cliente (la llevo yo)')}<button class="btn" data-a="okUsar" data-id="${h.id}">Marcar en uso</button>`);
    case 'okUsar':
      await put('h', 'herramientas', { ...h, estado: 'en_uso', cliente_id: $('#hc').value || null, usuario_id: S.me.id });
      closeSheet(); renderAll(); return toast('Marcada en uso');
    case 'devolver':
      await put('h', 'herramientas', { ...h, estado: 'disponible', cliente_id: null, usuario_id: null });
      renderAll(); return toast('Devuelta al depósito');
    case 'nuevaH':
      if (!isGestor()) return toast('Solo el coordinador o la administración agregan herramientas de la empresa');
      return sheet('<h2>Nueva herramienta</h2><label>Nombre<input id="hn" placeholder="Ej: Bomba de achique"></label><button class="btn" data-a="guardarH">Guardar herramienta</button>');
    case 'guardarH': {
      if (!isGestor()) return;
      const n = $('#hn').value.trim(); if (!n) return toast('Escribí el nombre');
      await put('h', 'herramientas', { nombre: n, estado: 'disponible' });
      closeSheet(); renderAll(); return toast('Herramienta guardada');
    }
    case 'color':
      S.me = await upd('p', 'perfiles', S.me.id, { color: d.id }) || S.me; return renderAll();
    case 'salir':
      if (S.me) await stopShare(); if (window.JCPush) await JCPush.olvidar(sb); return sb ? sb.auth.signOut().then(() => location.reload()) : location.reload();
  }
}
$('#q').addEventListener('input', renderClients);
$('#qChat').addEventListener('input', renderChats);
// Sin zoom con dos dedos en la app; solo el mapa lo permite
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => { if (!e.target.closest('#map')) e.preventDefault(); }, { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 && !e.target.closest('#map')) e.preventDefault(); }, { passive: false });
setInterval(() => {
  if (document.hidden || !S.me) return;
  pollU(); cargarPortal().catch(() => {});
  if (S.chat && !$('#chatV').hidden) openChat(S.chat, true).catch(() => {});
  if ($('#eqV').hidden) cargarEq().catch(() => {});
}, 20000);
document.addEventListener('input', e => { if (e.target.id === 'eqTxt') sugerirEq(); });
document.addEventListener('change', async e => {
  if (e.target.id !== 'eqFile' || !e.target.files[0]) return;
  try {
    eqFoto = await achicar(e.target.files[0]);
    $('#eqPrev').innerHTML = `<div class="row" style="padding:6px 0"><img src="${eqFoto}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:11px"><span class="grow sub" style="margin:0">Foto lista para enviar</span><button class="btn sm sec" data-a="quitarFotoEq" style="width:auto;margin:0">Quitar</button></div>`;
  } catch (err) { toast(err.message); }
  e.target.value = '';
});
document.addEventListener('change', async e => {
  if (e.target.id !== 'chatFile' || !e.target.files[0]) return;
  try {
    S.chatFoto = await achicar(e.target.files[0]);
    $('#chatPrev').innerHTML = `<div class="row" style="padding:6px 0"><img src="${S.chatFoto}" alt="" style="width:52px;height:52px;object-fit:cover;border-radius:11px"><span class="grow sub" style="margin:0">Foto lista para enviar</span><button class="btn sm sec" data-a="chatSinFoto">Quitar</button></div>`;
  } catch (err) { toast(err.message); }
  e.target.value = '';
});
document.addEventListener('change', e => {
  if (e.target.id !== 'foto' || !e.target.files[0]) return;
  const img = new Image();
  img.onload = async () => {
    const z = 192, cv = document.createElement('canvas'), m = Math.min(img.width, img.height);
    cv.width = cv.height = z;
    cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, z, z);
    try { S.me = await upd('p', 'perfiles', S.me.id, { foto: cv.toDataURL('image/jpeg', .8) }) || S.me; renderAll(); toast('Foto actualizada'); } catch (err) { toast(err.message); }
  };
  img.src = URL.createObjectURL(e.target.files[0]);
});

// ── Arranque
(async () => {
  if (sb) {
    const { data } = await sb.auth.getSession();
    if (data.session) return start(data.session.user);
  } else demo();
  authUI();
})();
</script>
</body>
</html>
