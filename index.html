<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>José Carrizo e Hijos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--navy2:#13315C;--g50:#F3F5F9;--g200:#E1E6ED;--g400:#9AA5B4;--g600:#5B6676;--ok:#05A357;--warn:#B45309}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%}
body{font:500 15px/1.35 Manrope,system-ui,sans-serif;color:var(--navy);background:#fff;display:flex;flex-direction:column;letter-spacing:-.1px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;color:inherit;width:100%;padding:14px;border:1px solid var(--g200);border-radius:8px;background:var(--g50);margin:6px 0 14px}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
label{display:block;font-weight:700;font-size:13px;color:var(--g600)}
h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-bottom:12px}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
h3{font-size:14px;font-weight:700;color:var(--g600);margin:20px 0 10px}
.sub{color:var(--g600);font-size:14px;margin-bottom:14px}
.note{background:var(--g50);border-radius:8px;padding:12px;font-size:13px;color:var(--g600);margin-bottom:14px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 20px) 16px 90px}
.view.on{display:block}
#v-mapa{padding:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--g50)}
#chipsMap{position:absolute;z-index:500;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--g200);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px #0b254518}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px #0b254566}
.pin::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;top:5px;left:5px}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--g200);width:100%;text-align:left}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:700}
.grow small{display:block;color:var(--g600);font-size:13px}
small.u{color:var(--warn)}small.a{color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;height:52px;width:100%;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;margin-top:10px;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98);background:var(--navy2)}
.btn.sec{background:var(--g50);color:var(--navy)}
.btn.sm{height:36px;width:auto;padding:0 16px;font-size:13px;margin:0}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));height:48px;padding:0 20px;border-radius:99px;background:var(--navy);color:#fff;font-weight:700;box-shadow:0 6px 18px #0b254544;z-index:600}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--g200);background:#fffffff5;padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--g600)}
nav button.on{color:var(--navy)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh button{width:40px;height:40px;font-size:22px;border-radius:50%;background:var(--g50)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:10px;font-size:11px;font-weight:700;color:var(--g600)}
.day b{font-size:16px;color:var(--navy)}
.day i{font-style:normal;font-size:11px;min-height:14px;color:var(--navy2)}
.day.hoy b{text-decoration:underline}
.day.on{background:var(--navy);color:#fff}.day.on b,.day.on i{color:#fff}
#gps{position:absolute;z-index:500;left:12px;bottom:14px;height:44px;padding:0 16px;border-radius:99px;background:#fff;border:1px solid var(--g200);font-weight:700;font-size:13px;box-shadow:0 2px 8px #0b254522}
#gps.on{background:var(--ok);border-color:var(--ok);color:#fff}
.wp{position:relative;width:36px;height:36px}
.wp .av{width:36px;height:36px;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 2px 6px #0b254566}
.wp span{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;box-shadow:0 1px 4px #0b254533}
#sh{position:fixed;inset:0;z-index:1000;display:none}
#sh.on{display:block}
.scrim{position:absolute;inset:0;background:#0b254566}
.panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:85%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--g200);margin:0 auto 16px}
.who{display:flex;gap:8px;align-items:center;font-weight:700;margin:6px 0 4px}
#auth{flex:1;padding:calc(env(safe-area-inset-top) + 56px) 24px 24px;overflow:auto;background:var(--navy);color:#fff}
#auth .brand{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-1px;margin-bottom:10px}
#auth .sub{color:#b9c6da;margin-bottom:28px}
#auth .btn{background:#fff;color:var(--navy)}#auth .btn.sec{background:#ffffff1f;color:#fff}
#auth .note{background:#ffffff1a;color:#d5deec}
.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800;margin-bottom:8px}
.up{display:inline-block;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--navy2);text-decoration:underline;cursor:pointer}
.up input{display:none}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:12px;margin-bottom:10px;color:var(--ink);background:var(--c);transition:transform .12s}
.card:active{transform:scale(.99)}
.card .grow small{color:inherit;opacity:.88}
.card>small{font-weight:700;font-size:13px}
.sw{display:flex;gap:12px;margin-bottom:28px}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--g200)}
.swb.on{box-shadow:0 0 0 3px var(--navy)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:14px;border-radius:8px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:700;font-size:14px}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="auth">
  <div class="brand">José Carrizo<br>e Hijos</div>
  <p class="sub">Mantenimiento de piletas · Mar del Plata</p>
  <div id="authForm"></div>
</section>

<div id="app" hidden>
  <main>
    <section class="view on" id="v-mapa"><div id="chipsMap"></div><div id="map"></div><button id="gps" data-a="gps"></button></section>
    <section class="view" id="v-clientes">
      <h1>Clientes</h1><div id="cal"></div><div id="dayList"></div><h3>Todos los clientes</h3><div id="chipsList"></div>
      <input id="q" placeholder="Buscar por nombre o dirección">
      <div id="listC"></div>
      <button class="fab" data-a="nuevoC">+ Nuevo cliente</button>
    </section>
    <section class="view" id="v-inv">
      <h1>Inventario</h1><div id="listH"></div>
      <button class="fab" data-a="nuevaH">+ Herramienta</button>
    </section>
    <section class="view" id="v-perfil"><div id="perfil"></div></section>
  </main>
  <nav>
    <button data-t="mapa" class="on"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 1114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Mapa</button>
    <button data-t="clientes"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Clientes</button>
    <button data-t="inv"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/></svg>Inventario</button>
    <button data-t="perfil"><svg viewBox="0 0 24 24"><path d="M20 21v-1a5 5 0 00-5-5H9a5 5 0 00-5 5v1"/><circle cx="12" cy="8" r="4"/></svg>Mi perfil</button>
  </nav>
</div>

<div id="sh"><div class="scrim" data-a="cerrar"></div><div class="panel"><i class="grab"></i><div id="sheetBody"></div></div></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ── Conexión: pegá acá los datos de tu proyecto de Supabase (Settings → API).
// Si quedan vacíos, la app corre en modo demo con datos de ejemplo.
const CFG = { url: 'https://gqromisweyqvdeeahxnl.supabase.co', key: 'sb_publishable_VjJCjpOaEgVfNSDJ7yFotw_HOfE-blF' };

const sb = CFG.url ? supabase.createClient(CFG.url, CFG.key) : null;
const COLORS = ['#2563EB', '#0E9F6E', '#F59E0B', '#DB2777', '#7C3AED', '#0891B2'];
const S = { p: [], c: [], h: [], me: null, F: null, u: [], sel: '', share: false };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const P = id => S.p.find(x => x.id === id);
const col = id => P(id)?.color || '#9AA5B4';
const nom = id => P(id)?.nombre || 'Sin asignar';
const FREQ = ['Semanal', 'Cada 15 días', 'Mensual', 'Otra'];
const DIAS = ['Sin día fijo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const opts = (a, s) => a.map(x => `<option ${x === s ? 'selected' : ''}>${x}</option>`).join('');
const isCoord = () => S.me?.rol === 'coordinador';
const DN = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const wkn = d => { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); t.setUTCDate(t.getUTCDate() + 4 - (t.getUTCDay() || 7)); return Math.ceil(((t - Date.UTC(t.getUTCFullYear(), 0, 1)) / 864e5 + 1) / 7); };
// Semanal y Otra: todas las semanas · Cada 15 días: semanas pares · Mensual: primera semana del mes
const visitsOn = d => vis().filter(c => c.dia === DN[d.getDay()] && (c.frecuencia === 'Cada 15 días' ? wkn(d) % 2 === 0 : c.frecuencia === 'Mensual' ? d.getDate() <= 7 : true));
const card = c => `<button class="card" style="--c:${col(c.piletero_id)};--ink:${ink(col(c.piletero_id))}" data-a="abrir" data-id="${c.id}"><div class="grow"><b>${esc(c.nombre)}</b><small>${esc(c.direccion)}</small><small>${esc(info(c))}</small></div><small>${esc(nom(c.piletero_id))}</small></button>`;
const info = c => (c.frecuencia || 'Semanal') + (c.dia && c.dia !== 'Sin día fijo' ? ' · ' + c.dia : '');
const ink = h => { const n = parseInt(h.slice(1), 16); return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) > 150 ? '#0B2545' : '#fff'; };
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2800); };

// ── Datos de ejemplo (modo demo)
function demo() {
  S.p = [{ id: 'p1', nombre: 'José', color: COLORS[0], rol: 'coordinador' }, { id: 'p2', nombre: 'Mariano', color: COLORS[1] }, { id: 'p3', nombre: 'Lucas', color: COLORS[2] }, { id: 'p4', nombre: 'Nico', color: COLORS[3] }];
  S.c = [
    { id: 'c1', dia: 'Lunes', nombre: 'Familia Pérez', direccion: 'Güemes 2450', lat: -37.9996, lng: -57.5547, notas: 'Pileta 8x4, cloro granulado', piletero_id: 'p1' },
    { id: 'c2', dia: 'Martes', nombre: 'Casa Rossi', direccion: 'Los Troncos, Almafuerte 1200', lat: -38.0105, lng: -57.553, notas: 'Tiene perro, avisar antes', piletero_id: 'p2' },
    { id: 'c3', dia: 'Lunes', nombre: 'Dpto. Costa Azul', direccion: 'Av. Constitución 5100', lat: -37.989, lng: -57.575, notas: '', piletero_id: 'p1' },
    { id: 'c4', dia: 'Miércoles', nombre: 'Hotel Playa Grande', direccion: 'Av. Martínez de Hoz 3300', lat: -38.029, lng: -57.534, notas: 'Pileta climatizada', piletero_id: 'p3' },
    { id: 'c5', dia: 'Jueves', nombre: 'Quinta Gómez', direccion: 'Punta Mogotes, Av. Félix U. Camet 900', lat: -38.075, lng: -57.546, notas: '', piletero_id: 'p4' },
    { id: 'c6', dia: 'Martes', frecuencia: 'Cada 15 días', nombre: 'Familia Suárez', direccion: 'Colón 2800', lat: -38.0023, lng: -57.55, notas: 'Limpieza de fondo semanal', piletero_id: 'p2' }
  ];
  S.h = [
    { id: 'h1', nombre: 'Bomba de achique', estado: 'disponible' },
    { id: 'h2', nombre: 'Aspiradora automática', estado: 'en_uso', cliente_id: 'c2', usuario_id: 'p2' },
    { id: 'h3', nombre: 'Kit medidor de pH', estado: 'disponible' },
    { id: 'h4', nombre: 'Barrefondo manual', estado: 'disponible' },
    { id: 'h5', nombre: 'Bomba centrífuga 1 HP', estado: 'en_uso', cliente_id: 'c4', usuario_id: 'p3' },
    { id: 'h6', nombre: 'Escoba de fondo', estado: 'en_uso', usuario_id: 'p1' }
  ];
  const ago = m => new Date(Date.now() - m * 6e4).toISOString();
  S.u = [
    { usuario_id: 'p2', lat: -38.0105, lng: -57.552, actualizado: ago(2) },
    { usuario_id: 'p3', lat: -38.027, lng: -57.536, actualizado: ago(8) },
    { usuario_id: 'p4', lat: -38.07, lng: -57.548, actualizado: ago(1) }
  ];
}

// ── Capa de datos (Supabase o memoria)
async function load() {
  const [p, c, h] = await Promise.all([sb.from('perfiles').select(), sb.from('clientes').select(), sb.from('herramientas').select()]);
  S.p = p.data || []; S.c = c.data || []; S.h = h.data || [];
}
async function put(k, table, row) {
  let r = row;
  if (sb) {
    const x = await sb.from(table).upsert(row).select().single();
    if (x.error) { toast(x.error.message); return null; }
    r = x.data;
  } else r = { id: crypto.randomUUID(), ...row };
  const i = S[k].findIndex(z => z.id === r.id);
  i < 0 ? S[k].push(r) : (S[k][i] = r);
  return r;
}
async function geo(q) {
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=' + encodeURIComponent(q + ', Mar del Plata'));
    const j = await r.json();
    if (j[0]) return [+j[0].lat, +j[0].lon];
  } catch (e) {}
  return null;
}

// ── Acceso
function authUI() {
  const f = $('#authForm');
  if (!sb) {
    f.innerHTML = '<p class="note">Modo demo: los cambios no se guardan. Cargá tus datos de Supabase en CFG para activar el registro real.</p>' +
      S.p.map(p => `<button class="btn" data-a="demo" data-id="${p.id}">Entrar como ${esc(p.nombre)}</button>`).join('');
  } else {
    f.innerHTML = '<input id="nm" placeholder="Tu nombre (solo al crear cuenta)"><input id="em" type="email" placeholder="Mail" autocomplete="email"><input id="pw" type="password" placeholder="Contraseña" autocomplete="current-password"><button class="btn" data-a="login">Entrar</button><button class="btn sec" data-a="registro">Crear cuenta</button>';
  }
}
async function auth(reg) {
  const email = $('#em').value.trim(), pw = $('#pw').value;
  let r;
  if (reg) {
    r = await sb.auth.signUp({ email, password: pw });
    if (r.error) return toast(r.error.message);
    if (!r.data.session) return toast('Revisá tu mail para confirmar la cuenta');
  } else {
    r = await sb.auth.signInWithPassword({ email, password: pw });
    if (r.error) return toast('Mail o contraseña incorrectos');
  }
  start(r.data.user, reg ? $('#nm').value.trim() : '');
}
async function start(u, name) {
  if (sb) {
    await load();
    let me = P(u.id);
    if (!me) me = await put('p', 'perfiles', { id: u.id, nombre: name || u.email.split('@')[0], color: COLORS[S.p.length % COLORS.length] });
    S.me = me;
  } else S.me = P(u);
  $('#auth').hidden = true; $('#app').hidden = false;
  S.sel = ymd(new Date()); initMap(); go('mapa'); renderAll(); pollU();
  try { if (localStorage.getItem('share') === '1') startShare(); } catch (e) {}
}

// ── Mapa
let map, layer, ulayer;
function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false, minZoom: 11, maxBounds: [[-38.3, -58.0], [-37.75, -57.25]], maxBoundsViscosity: .8 }).setView([-38.005, -57.55], 13);
  let warned = false;
  const T = (u, a, o = {}) => L.tileLayer(u, { attribution: a, maxZoom: 19, ...o }).on('tileerror', () => { if (!warned) { warned = true; toast('No cargan los mapas. Revisá la conexión a internet.'); } });
  const calles = T('https://tile.openstreetmap.org/{z}/{x}/{y}.png', '© OpenStreetMap').addTo(map);
  const claro = T('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', '© OpenStreetMap © CARTO');
  const sat = T('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Esri', { maxZoom: 18 });
  L.control.layers({ Calles: calles, Claro: claro, Satélite: sat }, null, { position: 'bottomright' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  ulayer = L.layerGroup().addTo(map);
}
const vis = () => S.c.filter(c => !S.F || c.piletero_id === S.F);
function renderMap() {
  layer.clearLayers();
  vis().forEach(c => L.marker([c.lat, c.lng], { icon: L.divIcon({ className: '', html: `<div class="pin" style="background:${col(c.piletero_id)}"></div>`, iconSize: [26, 26], iconAnchor: [13, 24] }) })
    .on('click', () => openCliente(c.id)).addTo(layer));
}

// ── Vistas
const chips = () => `<div class="chips"><button class="chip ${!S.F ? 'on' : ''}" data-f="">Todos</button>${S.p.map(p => `<button class="chip ${S.F === p.id ? 'on' : ''}" data-f="${p.id}"><i class="dot" style="background:${p.color}"></i>${esc(p.nombre)}</button>`).join('')}</div>`;
function renderClients() {
  const q = $('#q').value.toLowerCase();
  const l = vis().filter(c => (c.nombre + ' ' + c.direccion).toLowerCase().includes(q));
  $('#listC').innerHTML = l.length ? l.map(card).join('')
    : '<p class="note">No hay clientes para mostrar. Tocá “Nuevo cliente” para cargar el primero.</p>';
}
function renderInv() {
  const d = S.h.filter(h => h.estado === 'disponible').length;
  $('#listH').innerHTML = `<p class="sub">${d} disponibles · ${S.h.length - d} en uso</p>` + S.h.map(h => {
    const u = h.estado === 'en_uso';
    const cl = S.c.find(c => c.id === h.cliente_id);
    return `<div class="row"><div class="grow"><b>${esc(h.nombre)}</b><small class="${u ? 'u' : 'a'}">${u ? `${cl ? 'En ' + esc(cl.nombre) + ' · l' : 'L'}a tiene ${esc(nom(h.usuario_id))}` : 'Disponible en el depósito'}</small></div><button class="btn sm ${u ? 'sec' : ''}" data-a="${u ? 'devolver' : 'usar'}" data-id="${h.id}">${u ? 'Devolver' : 'Usar'}</button></div>`;
  }).join('');
}
function renderPerfil() {
  const m = S.me, mine = S.c.filter(c => c.piletero_id === m.id).length, tl = S.h.filter(h => h.usuario_id === m.id);
  const where = h => { const c = S.c.find(x => x.id === h.cliente_id); return c ? 'En ' + c.nombre : 'La llevo conmigo'; };
  $('#perfil').innerHTML = `<div class="avatar" style="background:${m.foto ? `center/cover url(${m.foto})` : m.color}">${m.foto ? '' : esc(m.nombre[0] || '?')}</div><label class="up">Cambiar foto<input type="file" id="foto" accept="image/*"></label><h1>${esc(m.nombre)}</h1><p class="sub">${isCoord() ? 'Coordinador · ' : ''}${mine} clientes · ${tl.length} herramientas</p><h3>Tu color en el mapa</h3><div class="sw">${COLORS.map(c => `<button class="swb ${c === m.color ? 'on' : ''}" style="background:${c}" data-a="color" data-id="${c}" aria-label="Color ${c}"></button>`).join('')}</div><h3>Mis herramientas (${tl.length})</h3>${tl.length ? tl.map(h => `<div class="row"><div class="grow"><b>${esc(h.nombre)}</b><small>${esc(where(h))}</small></div><button class="btn sm sec" data-a="devolver" data-id="${h.id}">Devolver</button></div>`).join('') : '<p class="note">No tenés herramientas. Tomalas desde Inventario con “Usar”.</p>'}${isCoord() ? `<h3>Equipo</h3>${S.p.map(p => `<div class="row"><i class="dot" style="background:${p.color}"></i><div class="grow"><b>${esc(p.nombre)}</b><small>${S.c.filter(c => c.piletero_id === p.id).length} clientes · ${S.h.filter(h => h.usuario_id === p.id).length} herramientas</small></div></div>`).join('')}` : ''}<button class="btn sec" data-a="salir" style="margin-top:24px">Cerrar sesión</button>`;
}
function renderCal() {
  const sel = new Date(S.sel + 'T12:00'), mon = new Date(sel);
  mon.setDate(sel.getDate() - ((sel.getDay() + 6) % 7));
  const days = [...Array(7)].map((_, i) => { const d = new Date(mon); d.setDate(mon.getDate() + i); return d; }), hoy = ymd(new Date());
  $('#cal').innerHTML = `<div class="calh"><button data-a="sem" data-id="-7" aria-label="Semana anterior">‹</button><b>${MES[mon.getMonth()]} ${mon.getFullYear()}</b><button data-a="sem" data-id="7" aria-label="Semana siguiente">›</button></div><div class="week">` +
    days.map(d => { const k = ymd(d), n = visitsOn(d).length; return `<button class="day ${k === S.sel ? 'on' : ''} ${k === hoy ? 'hoy' : ''}" data-a="dia" data-id="${k}"><span>${DN[d.getDay()][0]}</span><b>${d.getDate()}</b><i>${n || ''}</i></button>`; }).join('') + '</div>';
  const l = visitsOn(sel);
  $('#dayList').innerHTML = `<h3>${DN[sel.getDay()]} ${sel.getDate()} · ${l.length} ${l.length === 1 ? 'visita' : 'visitas'}</h3>` + (l.length ? l.map(card).join('') : '<p class="note">No hay visitas ese día. Elegí el día de visita desde la ficha de cada cliente.</p>');
}
function renderUsers() {
  if (!ulayer) return;
  ulayer.clearLayers();
  S.u.filter(u => isCoord() || u.usuario_id === S.me.id).forEach(u => {
    const p = P(u.usuario_id) || {}, mins = Math.round((Date.now() - new Date(u.actualizado)) / 6e4), c = p.color || '#0B2545';
    if (mins > 720) return;
    const age = mins < 1 ? 'ahora' : mins < 60 ? `hace ${mins} min` : `hace ${Math.round(mins / 60)} h`;
    L.marker([u.lat, u.lng], { zIndexOffset: 1000, icon: L.divIcon({ className: '', iconSize: [36, 36], iconAnchor: [18, 18], html: `<div class="wp" style="--c:${c}"><div class="av" style="background:${p.foto ? `center/cover url(${p.foto})` : c}">${p.foto ? '' : esc((p.nombre || '?')[0])}</div><span>${esc(u.usuario_id === S.me.id ? 'Vos' : p.nombre)} · ${age}</span></div>` }) }).addTo(ulayer);
  });
}
function gpsBtn() { const b = $('#gps'); b.classList.toggle('on', S.share); b.textContent = S.share ? 'Compartiendo mi ubicación' : 'Compartir mi ubicación'; }
let wid = null, last = 0;
function setU(u) { const i = S.u.findIndex(x => x.usuario_id === u.usuario_id); i < 0 ? S.u.push(u) : (S.u[i] = u); }
function startShare() {
  if (!navigator.geolocation) return toast('Este dispositivo no tiene GPS');
  if (S.share) return;
  S.share = true; last = 0;
  try { localStorage.setItem('share', '1'); } catch (e) {}
  wid = navigator.geolocation.watchPosition(async p => {
    const u = { usuario_id: S.me.id, lat: p.coords.latitude, lng: p.coords.longitude, actualizado: new Date().toISOString() };
    setU(u); renderUsers();
    if (Date.now() - last < 20000) return;
    last = Date.now();
    if (sb) { const x = await sb.from('ubicaciones').upsert(u); if (x.error) toast(x.error.message); }
  }, e => { toast(e.code === 1 ? 'Permiso de ubicación denegado. Activalo en los ajustes del navegador.' : 'No pude obtener tu ubicación.'); stopShare(); }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 30000 });
  gpsBtn(); toast('Compartiendo ubicación mientras la app esté abierta');
}
async function stopShare() {
  if (wid !== null) navigator.geolocation.clearWatch(wid);
  wid = null; S.share = false;
  S.u = S.u.filter(u => u.usuario_id !== S.me.id);
  try { localStorage.setItem('share', '0'); } catch (e) {}
  if (sb) await sb.from('ubicaciones').delete().eq('usuario_id', S.me.id);
  gpsBtn(); renderUsers();
}
async function pollU() {
  if (!sb || !S.me || !isCoord()) return;
  const r = await sb.from('ubicaciones').select();
  if (!r.error) { S.u = r.data; renderUsers(); }
}
function renderAll() {
  $('#chipsMap').innerHTML = chips(); $('#chipsList').innerHTML = chips();
  renderMap(); renderClients(); renderCal(); renderInv(); renderPerfil(); renderUsers(); gpsBtn();
}
function go(t) {
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('on', v.id === 'v-' + t));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.t === t));
  if (t === 'mapa' && map) setTimeout(() => map.invalidateSize(), 50);
}

// ── Hoja inferior
const sheet = h => { $('#sheetBody').innerHTML = h; $('#sh').classList.add('on'); };
const closeSheet = () => $('#sh').classList.remove('on');
function openCliente(id) {
  const c = S.c.find(x => x.id === id), mine = c.piletero_id === S.me.id;
  sheet(`<h2>${esc(c.nombre)}</h2><p class="sub">${esc(c.direccion)}</p><p class="who"><i class="dot" style="background:${col(c.piletero_id)}"></i>${c.piletero_id ? 'Lo atiende ' + esc(nom(c.piletero_id)) : 'Sin piletero asignado'}</p><p class="sub">Visita: ${esc(info(c))}</p>${c.notas ? `<p class="note">${esc(c.notas)}</p>` : ''}${mine ? '' : `<button class="btn" data-a="mio" data-id="${c.id}">Pasar a mis clientes</button>`}<button class="btn sec" data-a="editarC" data-id="${c.id}">Editar datos</button><a class="btn sec" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${c.lat},${c.lng}">Cómo llegar</a>`);
}
function formCliente(c) {
  c = c || {};
  sheet(`<h2>${c.id ? 'Editar cliente' : 'Nuevo cliente'}</h2><label>Nombre<input id="fn" value="${esc(c.nombre)}"></label><label>Dirección<input id="fd" value="${esc(c.direccion)}" placeholder="Ej: Güemes 2450"></label><label>Frecuencia de visita<select id="ff">${opts(FREQ, c.frecuencia || 'Semanal')}</select></label><label>Día de visita<select id="fy">${opts(DIAS, c.dia || 'Sin día fijo')}</select></label>${isCoord() ? `<label>Lo atiende<select id="fp">${S.p.map(p => `<option value="${p.id}" ${p.id === (c.piletero_id || S.me.id) ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></label>` : ''}<label>Notas<textarea id="ft" rows="2">${esc(c.notas)}</textarea></label><button class="btn" data-a="guardarC" data-id="${c.id || ''}">Guardar cliente</button>${c.id && isCoord() ? `<button class="btn sec" data-a="borrarC" data-id="${c.id}">Eliminar cliente</button>` : ''}`);
}

// ── Acciones
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-a],[data-f],[data-t]'); if (!t) return;
  const d = t.dataset, h = S.h.find(x => x.id === d.id);
  if ('f' in d) { S.F = d.f || null; return renderAll(); }
  if (d.t) return go(d.t);
  switch (d.a) {
    case 'sem': { const x = new Date(S.sel + 'T12:00'); x.setDate(x.getDate() + (+d.id)); S.sel = ymd(x); return renderCal(); }
    case 'dia': S.sel = d.id; return renderCal();
    case 'gps': return S.share ? stopShare() : startShare();
    case 'cerrar': return closeSheet();
    case 'demo': return start(d.id);
    case 'login': return auth(false);
    case 'registro': return auth(true);
    case 'abrir': return openCliente(d.id);
    case 'mio': {
      const c = S.c.find(x => x.id === d.id);
      await put('c', 'clientes', { ...c, piletero_id: S.me.id });
      closeSheet(); renderAll(); return toast('Ahora es tu cliente');
    }
    case 'nuevoC': return formCliente();
    case 'editarC': return formCliente(S.c.find(x => x.id === d.id));
    case 'guardarC': {
      const c = S.c.find(x => x.id === d.id), n = $('#fn').value.trim(), dir = $('#fd').value.trim();
      if (!n || !dir) return toast('Completá nombre y dirección');
      let g = c && dir === c.direccion ? [c.lat, c.lng] : null;
      if (!g) { t.disabled = true; g = await geo(dir); t.disabled = false; }
      if (!g) return toast('No encontré esa dirección. Probá con calle y número.');
      await put('c', 'clientes', { ...c, nombre: n, direccion: dir, lat: g[0], lng: g[1], frecuencia: $('#ff').value, dia: $('#fy').value, notas: $('#ft').value.trim(), piletero_id: $('#fp') ? $('#fp').value : (c?.piletero_id || S.me.id) });
      closeSheet(); renderAll(); return toast('Cliente guardado');
    }
    case 'borrarC': {
      if (!confirm('¿Eliminar este cliente?')) return;
      if (sb) { const x = await sb.from('clientes').delete().eq('id', d.id); if (x.error) return toast(x.error.message); }
      S.c = S.c.filter(x => x.id !== d.id); S.h.forEach(x => { if (x.cliente_id === d.id) x.cliente_id = null; });
      closeSheet(); renderAll(); return toast('Cliente eliminado');
    }
    case 'usar':
      return sheet(`<h2>${esc(h.nombre)}</h2><p class="sub">¿En qué cliente la vas a usar?</p><select id="hc"><option value="">Sin cliente (la llevo yo)</option>${S.c.map(c => `<option value="${c.id}">${esc(c.nombre)} — ${esc(c.direccion)}</option>`).join('')}</select><button class="btn" data-a="okUsar" data-id="${h.id}">Marcar en uso</button>`);
    case 'okUsar':
      await put('h', 'herramientas', { ...h, estado: 'en_uso', cliente_id: $('#hc').value || null, usuario_id: S.me.id });
      closeSheet(); renderAll(); return toast('Marcada en uso');
    case 'devolver':
      await put('h', 'herramientas', { ...h, estado: 'disponible', cliente_id: null, usuario_id: null });
      renderAll(); return toast('Devuelta al depósito');
    case 'nuevaH':
      return sheet('<h2>Nueva herramienta</h2><label>Nombre<input id="hn" placeholder="Ej: Bomba de achique"></label><button class="btn" data-a="guardarH">Guardar herramienta</button>');
    case 'guardarH': {
      const n = $('#hn').value.trim(); if (!n) return toast('Escribí el nombre');
      await put('h', 'herramientas', { nombre: n, estado: 'disponible' });
      closeSheet(); renderAll(); return toast('Herramienta guardada');
    }
    case 'color':
      S.me = await put('p', 'perfiles', { ...S.me, color: d.id }) || S.me; return renderAll();
    case 'salir':
      await stopShare(); return sb ? sb.auth.signOut().then(() => location.reload()) : location.reload();
  }
});
$('#q').addEventListener('input', renderClients);
setInterval(() => { if (!document.hidden) pollU(); }, 20000);
document.addEventListener('change', e => {
  if (e.target.id !== 'foto' || !e.target.files[0]) return;
  const img = new Image();
  img.onload = async () => {
    const z = 192, cv = document.createElement('canvas'), m = Math.min(img.width, img.height);
    cv.width = cv.height = z;
    cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, z, z);
    S.me = await put('p', 'perfiles', { ...S.me, foto: cv.toDataURL('image/jpeg', .8) }) || S.me;
    renderAll(); toast('Foto actualizada');
  };
  img.src = URL.createObjectURL(e.target.files[0]);
});

// ── Arranque
(async () => {
  if (sb) {
    const { data } = await sb.auth.getSession();
    if (data.session) return start(data.session.user);
  } else demo();
  authUI();
})();
</script>
</body>
</html>
