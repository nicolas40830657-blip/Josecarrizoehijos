<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>José Carrizo e Hijos</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#0B2545">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carrizo">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0B2545;--navy2:#13315C;--g50:#F3F5F9;--g200:#E1E6ED;--g400:#9AA5B4;--g600:#5B6676;--ok:#05A357;--warn:#B45309}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html,body{height:100%;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{font:500 15px/1.35 Manrope,system-ui,sans-serif;color:var(--navy);background:#fff;display:flex;flex-direction:column;letter-spacing:-.1px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select,textarea{font:inherit;font-size:16px;color:inherit;width:100%;padding:14px;border:1px solid var(--g200);border-radius:8px;background:var(--g50);margin:6px 0 14px}
:focus-visible{outline:2px solid var(--navy2);outline-offset:2px}
label{display:block;font-weight:700;font-size:13px;color:var(--g600)}
h1{font-size:28px;font-weight:800;letter-spacing:-.6px;margin-bottom:12px}
h2{font-size:22px;font-weight:800;letter-spacing:-.4px;margin-bottom:4px}
h3{font-size:14px;font-weight:700;color:var(--g600);margin:20px 0 10px}
.sub{color:var(--g600);font-size:14px;margin-bottom:14px}
.note{background:var(--g50);border-radius:8px;padding:12px;font-size:13px;color:var(--g600);margin-bottom:14px}
#app{flex:1;display:flex;flex-direction:column;min-height:0}
main{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow:auto;display:none;padding:calc(env(safe-area-inset-top) + 20px) 16px 90px}
.view.on{display:block}
#v-mapa{padding:0;overflow:hidden}
#map{position:absolute;inset:0;background:var(--g50)}
#chipsMap{position:absolute;z-index:500;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none}
.chip{flex:none;padding:8px 14px;border-radius:99px;background:#fff;border:1px solid var(--g200);font-weight:700;font-size:13px;display:flex;gap:6px;align-items:center;box-shadow:0 2px 8px #0b254518}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:3px solid #fff;box-shadow:0 2px 6px #0b254566}
.pin::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#fff;top:5px;left:5px}
.row{display:flex;gap:12px;align-items:center;padding:14px 0;border-bottom:1px solid var(--g200);width:100%;text-align:left}
.grow{flex:1;min-width:0}
.grow b{display:block;font-weight:700}
.grow small{display:block;color:var(--g600);font-size:13px}
small.u{color:var(--warn)}small.a{color:var(--ok)}
.btn{display:flex;align-items:center;justify-content:center;height:52px;width:100%;border-radius:8px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none;margin-top:10px;transition:transform .12s,background .12s}
.btn:active{transform:scale(.98);background:var(--navy2)}
.btn.sec{background:var(--g50);color:var(--navy)}
.btn.sm{height:36px;width:auto;padding:0 16px;font-size:13px;margin:0}
.fab{position:fixed;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));height:48px;padding:0 20px;border-radius:99px;background:var(--navy);color:#fff;font-weight:700;box-shadow:0 6px 18px #0b254544;z-index:600}
nav{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--g200);background:#fffffff5;padding-bottom:env(safe-area-inset-bottom)}
nav button{padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700;color:var(--g600)}
nav button.on{color:var(--navy)}
nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.calh button{width:40px;height:40px;font-size:22px;border-radius:50%;background:var(--g50)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;border-radius:10px;font-size:11px;font-weight:700;color:var(--g600)}
.day b{font-size:16px;color:var(--navy)}
.day i{font-style:normal;font-size:11px;min-height:14px;color:var(--navy2)}
.day.hoy b{text-decoration:underline}
.day.on{background:var(--navy);color:#fff}.day.on b,.day.on i{color:#fff}
#gps{position:absolute;z-index:500;left:12px;bottom:14px;height:44px;padding:0 16px;border-radius:99px;background:#fff;border:1px solid var(--g200);font-weight:700;font-size:13px;box-shadow:0 2px 8px #0b254522}
#gps.on{background:var(--ok);border-color:var(--ok);color:#fff}
.wp{position:relative;width:36px;height:36px}
.wp .av{width:36px;height:36px;border-radius:50%;border:3px solid var(--c);display:grid;place-items:center;color:#fff;font-weight:800;box-shadow:0 2px 6px #0b254566}
.wp span{position:absolute;top:40px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:var(--navy);font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;box-shadow:0 1px 4px #0b254533}
.dh{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px}.dh h3{margin:0}
.acts{display:flex;gap:6px}
.day{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
#mic{position:fixed;right:16px;bottom:calc(132px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;box-shadow:0 6px 18px #0b254455;z-index:700;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#mic svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic.on{background:#D72113;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 14px #d7211333}}
#heard{position:fixed;right:84px;bottom:calc(140px + env(safe-area-inset-bottom));max-width:62%;background:#fff;border:1px solid var(--g200);border-radius:12px;padding:10px 12px;font-size:13px;font-weight:700;box-shadow:0 2px 8px #0b254522;z-index:700}
#ruta{position:absolute;z-index:500;top:calc(env(safe-area-inset-top) + 60px);left:12px;right:12px;background:#fff;border-radius:12px;padding:12px;box-shadow:0 4px 16px #0b254533}
#ruta b{display:block}#ruta small{display:block;color:var(--g600);margin-bottom:8px}
#ruta .chips{padding-bottom:4px}#ruta .acts{margin-top:6px}#ruta .btn{margin:0;flex:1;height:44px}
#auth input{color:#111;background:#fff;border-color:#fff}
#auth input::placeholder{color:#6b7280}
.card.vis{cursor:pointer}
.chk{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);font-weight:800;font-size:18px;line-height:1;color:var(--ink);opacity:.65}
.card.ok .chk{background:var(--ink);color:var(--c);opacity:1}
.btn:disabled{opacity:.5}
.pend{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--navy);color:#fff;border-radius:12px;padding:14px 16px;margin:8px 0 12px}
.pend small{display:block;opacity:.8;font-size:12px}.pend b{display:block;font-size:22px}
.pend .btn{background:#fff;color:var(--navy);margin:0;width:auto;height:44px;padding:0 22px}
.card.ok .grow b{text-decoration:line-through}
.alert{background:#FEF2F2;color:#B42318;border-radius:8px;padding:12px;font-weight:700;font-size:13px;margin-bottom:14px}
.fotos{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.num-pin{width:26px;height:26px;border-radius:50%;background:#0B2545;color:#fff;border:2px solid #fff;display:grid;place-items:center;font-weight:800;font-size:13px;box-shadow:0 2px 6px #0b254566}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0 12px}
.stats div{background:var(--g50);border-radius:10px;padding:12px}
.stats small{display:block;color:var(--g600);font-size:12px}
.stats b{display:block;font-size:18px;margin-top:2px}
.num{text-align:right}.num b{font-size:15px}.num small{font-size:12px;color:var(--g600)}
.arrow{width:40px;height:40px;font-size:22px;border-radius:50%;background:var(--g50)}
#sh{position:fixed;inset:0;z-index:1000;display:none}
#sh.on{display:block}
.scrim{position:absolute;inset:0;background:#0b254566}
.panel{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:16px 16px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));max-height:85%;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{display:block;width:36px;height:4px;border-radius:2px;background:var(--g200);margin:0 auto 16px}
.who{display:flex;gap:8px;align-items:center;font-weight:700;margin:6px 0 4px}
#auth{flex:1;padding:calc(env(safe-area-inset-top) + 56px) 24px 24px;overflow:auto;background:var(--navy);color:#fff}
#auth .brand{font-size:38px;line-height:1.05;font-weight:800;letter-spacing:-1px;margin-bottom:10px}
#auth .sub{color:#b9c6da;margin-bottom:28px}
#auth .btn{background:#fff;color:var(--navy)}#auth .btn.sec{background:#ffffff1f;color:#fff}
#auth .note{background:#ffffff1a;color:#d5deec}
.avatar{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:34px;font-weight:800;margin-bottom:8px}
.up{display:inline-block;margin-bottom:14px;font-size:13px;font-weight:700;color:var(--navy2);text-decoration:underline;cursor:pointer}
.up input{display:none}
.card{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:12px;margin-bottom:10px;color:var(--ink);background:var(--c);transition:transform .12s}
.card:active{transform:scale(.99)}
.card{-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.btn.wa{background:var(--ok)}
.card .grow small{color:inherit;opacity:.88}
.card>small{font-weight:700;font-size:13px}
.sw{display:flex;gap:12px;margin-bottom:28px}
.swb{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px var(--g200)}
.swb.on{box-shadow:0 0 0 3px var(--navy)}
#toast{position:fixed;left:16px;right:16px;bottom:calc(84px + env(safe-area-inset-bottom));background:var(--navy);color:#fff;padding:14px;border-radius:8px;z-index:2000;opacity:0;pointer-events:none;transition:opacity .2s;font-weight:700;font-size:14px}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="auth">
  <div class="brand">José Carrizo<br>e Hijos</div>
  <p class="sub">Mantenimiento de piletas · Mar del Plata</p>
  <div id="authForm"></div>
</section>

<div id="app" hidden>
  <main>
    <section class="view on" id="v-mapa"><div id="chipsMap"></div><div id="map"></div><button id="gps" data-a="gps"></button><div id="ruta" hidden></div></section>
    <section class="view" id="v-clientes">
      <h1>Clientes</h1><div id="cal"></div><div id="dayList"></div><h3 id="todos">Todos los clientes</h3><div id="chipsList"></div>
      <input id="q" placeholder="Buscar por nombre o dirección">
      <div id="listC"></div>
      <button class="fab" data-a="nuevoC">+ Nuevo cliente</button>
    </section>
    <section class="view" id="v-inv">
      <h1>Inventario</h1><div class="chips" id="seg"></div><div id="listH"></div><div id="listP" hidden></div>
      <button class="fab" id="fabH" data-a="nuevaH">+ Herramienta</button>
    </section>
    <section class="view" id="v-perfil"><div id="perfil"></div></section>
  </main>
  <nav>
    <button data-t="mapa" class="on"><svg viewBox="0 0 24 24"><path d="M12 21s-7-6.2-7-11a7 7 0 1114 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>Mapa</button>
    <button data-t="clientes"><svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Clientes</button>
    <button data-t="inv"><svg viewBox="0 0 24 24"><path d="M21 8l-9-5-9 5v8l9 5 9-5V8zM3 8l9 5 9-5M12 13v8"/></svg>Inventario</button>
    <button data-t="perfil"><svg viewBox="0 0 24 24"><path d="M20 21v-1a5 5 0 00-5-5H9a5 5 0 00-5 5v1"/><circle cx="12" cy="8" r="4"/></svg>Mi perfil</button>
  </nav>
  <button id="mic" aria-label="Asistente de voz"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0014 0M12 18v3"/></svg></button>
  <div id="heard" hidden></div>
</div>

<div id="sh"><div class="scrim" data-a="cerrar"></div><div class="panel"><i class="grab"></i><div id="sheetBody"></div></div></div>
<div id="toast" role="status"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ── Conexión: pegá acá los datos de tu proyecto de Supabase (Settings → API).
// Si quedan vacíos, la app corre en modo demo con datos de ejemplo.
const CFG = { url: 'https://gqromisweyqvdeeahxnl.supabase.co', key: 'sb_publishable_VjJCjpOaEgVfNSDJ7yFotw_HOfE-blF' };

const sb = CFG.url ? supabase.createClient(CFG.url, CFG.key) : null;
const COLORS = ['#2563EB', '#0E9F6E', '#F59E0B', '#DB2777', '#7C3AED', '#0891B2'];
const S = { p: [], c: [], h: [], v: [], r: [], pg: [], vt: [], fo: [], vcl: null, mov: [], co: {}, vc: {}, pr: [], k: [], inv: 'herr', mes: '', me: null, F: null, u: [], sel: '', share: false, modo: 'auto' };
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
const P = id => S.p.find(x => x.id === id);
const col = id => P(id)?.color || '#9AA5B4';
const nom = id => P(id)?.nombre || 'Sin asignar';
const FREQ = ['Semanal', 'Cada 15 días', 'Mensual', 'Otra'];
const DIAS = ['Sin día fijo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const opts = (a, s) => a.map(x => `<option ${x === s ? 'selected' : ''}>${x}</option>`).join('');
const isCoord = () => S.me?.rol === 'coordinador';
const canDel = c => isGestor() || c.piletero_id === S.me?.id;
const isGestor = () => ['coordinador', 'administrador'].includes(S.me?.rol);
const pileteros = () => S.p.filter(p => p.rol !== 'administrador');
const mesStats = k => {
  const rs = S.r.filter(r => (r.fecha || '').startsWith(k)), vs = S.vt.filter(v => (v.fecha || '').startsWith(k)), ps = S.pg.filter(x => (x.fecha || '').startsWith(k));
  const sv = sumar(rs), tp = vs.reduce((a, v) => a + (+v.total || 0), 0);
  return { n: sv.n, piletas: new Set(rs.map(r => r.cliente_id).filter(Boolean)).size, visitas: sv.t, prod: tp, total: sv.t + tp, emp: sv.emp, pagado: ps.reduce((a, x) => a + (+x.monto || 0), 0) };
};
const PORC = 0.7, PP = Math.round(PORC * 100); // 70% para el piletero, el resto para la empresa
const peso = n => '$' + Math.round(+n || 0).toLocaleString('es-AR');
const mesDe = k => new Date(+k.slice(0, 4), +k.slice(5, 7) - 1, 1, 12);
const mesTxt = k => MES[mesDe(k).getMonth()] + ' ' + mesDe(k).getFullYear();
const delMes = l => l.filter(r => (r.fecha || '').startsWith(S.mes));
const sumar = l => { const t = l.reduce((a, r) => a + (+r.valor || 0), 0); return { n: l.length, t, mio: t * PORC, emp: t * (1 - PORC) }; };
const lunes = f => { const d = new Date(f + 'T12:00'); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return d; };
const corto = d => d.toLocaleDateString('es-AR', { day: 'numeric', month: 'short' });
// Convierte teléfonos argentinos (con 0, 15, 54 o 549) al formato que pide WhatsApp: 549 + código de área + número
const waNum = t => {
  let d = String(t || '').replace(/\D/g, '');
  if (!d) return '';
  if (d.startsWith('54')) d = d.slice(2);
  if (d.startsWith('9') && d.length === 11) d = d.slice(1);
  d = d.replace(/^0/, '');
  const m = d.match(/^(\d{2,4})15(\d+)$/);
  if (m && m[1].length + m[2].length === 10) d = m[1] + m[2];
  return d.length === 10 ? '549' + d : d;
};
const waLink = c => 'https://wa.me/' + waNum(c.telefono) + '?text=' + encodeURIComponent('Hola ' + c.nombre + ', te escribimos de José Carrizo e Hijos por el mantenimiento de la pileta.');
const contact = c => c.telefono ? `<a class="btn wa" target="_blank" rel="noopener" href="${waLink(c)}">Escribir por WhatsApp</a><a class="btn sec" href="tel:${esc(c.telefono.replace(/[^\d+]/g, ''))}">Llamar</a>` : '';
const DN = ['Domingo', 'Lunes', 'Martes', 'Miércoles', 'Jueves', 'Viernes', 'Sábado'];
const MES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const REP = { no: 'Una sola vez', semanal: 'Todas las semanas', quincenal: 'Cada 15 días' };
const visitsOn = d => {
  const k = new Date(ymd(d) + 'T12:00');
  return S.v.filter(v => {
    const n = Math.round((k - new Date(v.fecha + 'T12:00')) / 864e5), c = S.c.find(x => x.id === v.cliente_id);
    if ((v.omitir || []).includes(ymd(d))) return false;
    return c && (isGestor() ? !S.F || c.piletero_id === S.F : c.piletero_id === S.me.id) && (v.repetir === 'semanal' ? n >= 0 && n % 7 === 0 : v.repetir === 'quincenal' ? n >= 0 && n % 14 === 0 : n === 0);
  }).sort((a, b) => (a.hora || '99').localeCompare(b.hora || '99'));
};
const vcard = v => {
  const c = S.c.find(x => x.id === v.cliente_id), k = col(c.piletero_id), ok = S.r.some(r => r.visita_id === v.id && r.fecha === S.sel);
  return `<div class="card vis ${ok ? 'ok' : ''}" style="--c:${k};--ink:${ink(k)}" data-a="visita" data-id="${v.id}"><div class="grow"><b>${esc(c.nombre)}</b><small>${esc(c.direccion)}</small><small>${v.hora ? v.hora.slice(0, 5) + ' · ' : ''}${REP[v.repetir]}${c.valor_visita ? ' · ' + peso(c.valor_visita) : ''} · ${esc(nom(c.piletero_id))}</small>${avisoCliente(c)}</div><button class="chk" data-a="chk" data-id="${v.id}" aria-label="${ok ? 'Desmarcar visita' : 'Confirmar visita'}">✓</button></div>`;
};
const card = c => `<button class="card" style="--c:${col(c.piletero_id)};--ink:${ink(col(c.piletero_id))}" data-a="abrir" data-id="${c.id}"><div class="grow"><b>${esc(c.nombre)}</b><small>${esc(c.direccion)}</small><small>${esc(info(c))}</small>${avisoCliente(c)}</div><small>${esc(nom(c.piletero_id))}</small></button>`;
const info = c => (c.frecuencia || 'Semanal') + (c.dia && c.dia !== 'Sin día fijo' ? ' · ' + c.dia : '');
const ink = h => { const n = parseInt(h.slice(1), 16); return (.299 * (n >> 16) + .587 * (n >> 8 & 255) + .114 * (n & 255)) > 150 ? '#0B2545' : '#fff'; };
const toast = t => { const e = $('#toast'); e.textContent = t; e.classList.add('on'); setTimeout(() => e.classList.remove('on'), 2800); };

// ── Capa de datos (Supabase o memoria)
async function load() {
  const [p, c, h, v, r, vt, pr, k, pg, mv, co, vcs] = await Promise.all([sb.from('perfiles').select(), sb.from('clientes').select(), sb.from('herramientas').select(), sb.from('visitas').select(), sb.from('realizadas').select(), sb.from('ventas').select(), sb.from('productos').select(), sb.from('kits').select(), sb.from('pagos').select(), sb.from('movimientos').select().order('creado', { ascending: false }).limit(200), sb.from('costos').select(), sb.from('ventas_costos').select()]);
  S.p = p.data || []; S.c = c.data || []; S.h = h.data || []; S.v = v.data || []; S.r = r.data || []; S.vt = (vt.data || []).filter(x => !x.anulada); S.pr = pr.data || []; S.k = k.data || []; S.pg = pg.data || []; S.mov = mv.data || []; S.co = {}; (co.data || []).forEach(x => { S.co[x.producto_id] = +x.costo; }); S.vc = {}; (vcs.data || []).forEach(x => { S.vc[x.venta_id] = +x.costo; });
}
async function put(k, table, row) {
  let r = row;
  if (sb) {
    const x = await sb.from(table).upsert(row).select().single();
    if (x.error) throw new Error(x.error.message);
    r = x.data;
  } else r = { id: crypto.randomUUID(), ...row };
  const i = S[k].findIndex(z => z.id === r.id);
  i < 0 ? S[k].push(r) : (S[k][i] = r);
  return r;
}
function achicar(file, max = 1000) {
  return new Promise((ok, no) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      URL.revokeObjectURL(img.src); ok(cv.toDataURL('image/jpeg', .7));
    };
    img.onerror = () => no(new Error('No pude leer la foto'));
    img.src = URL.createObjectURL(file);
  });
}
async function subirFoto(r, file) {
  const data = await achicar(file), row = { realizada_id: r.id, cliente_id: r.cliente_id, data };
  if (sb) { const x = await sb.from('fotos').insert(row).select().single(); if (x.error) throw new Error(x.error.message); S.fo.push(x.data); }
  else S.fo.push({ id: crypto.randomUUID(), creado: new Date().toISOString(), ...row });
}
async function cargarFotos(cid) {
  if (!sb) return;
  const x = await sb.from('fotos').select().eq('cliente_id', cid).order('creado', { ascending: false }).limit(60);
  if (!x.error) S.fo = [...S.fo.filter(f => f.cliente_id !== cid), ...x.data];
}
async function rpc(name, args) {
  if (sb) { const x = await sb.rpc(name, args); if (x.error) throw new Error(x.error.message); await load(); return x.data; }
  return localRpc(name, args);
}
function localRpc(n, a) {
  const log = (p, tipo, c, v, nota) => S.mov.unshift({ id: crypto.randomUUID(), creado: new Date().toISOString(), producto_id: p.id, nombre: p.nombre, tipo, cantidad: c, stock_resultante: p.stock, usuario_id: S.me.id, venta_id: v || null, nota: nota || null });
  if (n === 'vender') {
    const it = (a.p_tipo === 'p' ? S.pr : S.k).find(x => x.id === a.p_item), items = a.p_tipo === 'p' ? [{ p: it.id, n: 1 }] : it.items;
    for (const i of items) { const p = S.pr.find(x => x.id === i.p); if (!p || p.stock < i.n * a.p_cant) throw new Error('No hay stock suficiente de ' + (p ? p.nombre : 'un producto')); }
    const id = crypto.randomUUID(); let costo = 0;
    S.vt.unshift({ id, fecha: ymd(new Date()), tipo: a.p_tipo, item_id: it.id, nombre: it.nombre, cantidad: a.p_cant, total: it.precio * a.p_cant, porc: +S.me.porc_productos || 0, vendedor_id: S.me.id, cliente_id: a.p_cliente, items, cobrado: a.p_cobrado, anulada: false, creado: new Date().toISOString() });
    items.forEach(i => { const p = S.pr.find(x => x.id === i.p); p.stock -= i.n * a.p_cant; costo += (S.co[p.id] || 0) * i.n * a.p_cant; log(p, 'venta', -i.n * a.p_cant, id); });
    S.vc[id] = costo; return id;
  }
  if (n === 'anular_venta') {
    const v = S.vt.find(x => x.id === a.p_id); if (!v) throw new Error('La venta no existe');
    (v.items || []).forEach(i => { const p = S.pr.find(x => x.id === i.p); if (p) { p.stock += i.n * v.cantidad; log(p, 'anulacion', i.n * v.cantidad, v.id); } });
    S.vt = S.vt.filter(x => x.id !== v.id); return;
  }
  if (n === 'cobrar_venta') { const v = S.vt.find(x => x.id === a.p_id); if (v) v.cobrado = a.p_cobrado; return; }
  if (n === 'ajustar_stock') {
    const p = S.pr.find(x => x.id === a.p_producto), nuevo = a.p_tipo === 'reposicion' ? p.stock + a.p_cant : a.p_cant, delta = nuevo - p.stock;
    if (nuevo < 0) throw new Error('El stock no puede ser negativo');
    p.stock = nuevo; if (delta) log(p, a.p_tipo, delta, null, a.p_nota);
  }
}
async function upd(k, table, id, f) {
  const i = S[k].findIndex(z => z.id === id);
  if (sb) { const x = await sb.from(table).update(f).eq('id', id).select().single(); if (x.error) throw new Error(x.error.message); S[k][i] = x.data; return x.data; }
  S[k][i] = { ...S[k][i], ...f }; return S[k][i];
}
async function setCosto(id, costo) {
  if (sb) { const x = await sb.from('costos').upsert({ producto_id: id, costo }); if (x.error) throw new Error(x.error.message); }
  S.co[id] = costo;
}
async function del(k, table, id) {
  if (sb) { const x = await sb.from(table).delete().eq('id', id); if (x.error) throw new Error(x.error.message); }
  S[k] = S[k].filter(z => z.id !== id);
}
async function geo(q) {
  try {
    const r = await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ar&q=' + encodeURIComponent(q + ', Mar del Plata'));
    const j = await r.json();
    if (j[0]) return [+j[0].lat, +j[0].lon];
  } catch (e) {}
  return null;
}

async function auth(reg) {
  const email = $('#em').value.trim(), pw = $('#pw').value;
  if (!email || pw.length < 6) return toast('Completá tu mail y una contraseña de al menos 6 caracteres');
  let r;
  if (reg) {
    r = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: location.origin + location.pathname } });
    if (r.error) return toast(r.error.message);

let map, layer, ulayer, rlayer;
function initMap() {
  if (map) return;
  map = L.map('map', { zoomControl: false, minZoom: 11, maxBounds: [[-38.3, -58.0], [-37.75, -57.25]], maxBoundsViscosity: .8 }).setView([-38.005, -57.55], 13);
  let warned = false;
  const T = (u, a, o = {}) => L.tileLayer(u, { attribution: a, maxZoom: 19, ...o }).on('tileerror', () => { if (!warned) { warned = true; toast('No cargan los mapas. Revisá la conexión a internet.'); } });
  const calles = T('https://tile.openstreetmap.org/{z}/{x}/{y}.png', '© OpenStreetMap').addTo(map);
  const claro = T('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', '© OpenStreetMap © CARTO');
  const sat = T('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', 'Esri', { maxZoom: 18 });
  L.control.layers({ Calles: calles, Claro: claro, Satélite: sat }, null, { position: 'bottomright' }).addTo(map);
  layer = L.layerGroup().addTo(map);
  ulayer = L.layerGroup().addTo(map);
  rlayer = L.layerGroup().addTo(map);
}

const PERF = { auto: 'car', moto: 'car', bici: 'bike', pie: 'foot' };
const GMODE = { auto: 'driving', moto: 'two-wheeler', bici: 'bicycling', pie: 'walking' };
const MODOS = { auto: 'Auto', moto: 'Moto', bici: 'Bici', pie: 'A pie' };
let R = null;
const hav = (a, b) => { const r = Math.PI / 180, x = (b[1] - a[1]) * r * Math.cos((a[0] + b[0]) / 2 * r), y = (b[0] - a[0]) * r; return Math.sqrt(x * x + y * y) * 6371; };

      S.v = S.v.filter(x => x.id !== d.id); closeSheet(); renderAll(); return toast('Visita eliminada');
    case 'asignar':
      return sheet(`<h2>${esc(h.nombre)}</h2><label>¿Quién la tiene?<select id="ah"><option value="">En el depósito</option>${S.p.map(p => `<option value="${p.id}" ${p.id === h.usuario_id ? 'selected' : ''}>${esc(p.nombre)}</option>`).join('')}</select></label><label>¿Está en un cliente?<select id="ac"><option value="">No</option>${S.c.map(c => `<option value="${c.id}" ${c.id === h.cliente_id ? 'selected' : ''}>${esc(c.nombre)} — ${esc(c.direccion)}</option>`).join('')}</select></label><button class="btn" data-a="okAsignar" data-id="${h.id}">Guardar</button><button class="btn sec" data-a="borrarH" data-id="${h.id}">Eliminar herramienta</button>`);
    case 'okAsignar': {
      const u = $('#ah').value || null, c = $('#ac').value || null;
      await put('h', 'herramientas', { ...h, usuario_id: u, cliente_id: c, estado: u || c ? 'en_uso' : 'disponible' });
      closeSheet(); renderAll(); return toast('Herramienta actualizada');
    }
    case 'borrarH':
      if (!confirm('¿Quitar esta herramienta del inventario?')) return;
      if (sb) { const x = await sb.from('herramientas').delete().eq('id', d.id); if (x.error) return toast(x.error.message); }
      S.h = S.h.filter(x => x.id !== d.id); closeSheet(); renderAll(); return toast('Herramienta eliminada');
    case 'nuevaHP':
      return sheet('<h2>Mi herramienta</h2><p class="sub">Va a aparecer en el inventario como tuya.</p><label>Nombre<input id="hn" placeholder="Ej: Barrehojas"></label><button class="btn" data-a="guardarHP">Guardar herramienta</button>');
    case 'guardarHP': {
      const n = $('#hn').value.trim(); if (!n) return toast('Escribí el nombre');
      await put('h', 'herramientas', { nombre: n, estado: 'en_uso', usuario_id: S.me.id, propietario_id: S.me.id });
      closeSheet(); renderAll(); return toast('Herramienta guardada');
    }
    case 'ir': { const c = S.c.find(x => x.id === d.id); return ruta([{ lat: c.lat, lng: c.lng }], 'A ' + c.nombre); }
    case 'recorrido': {
      const seen = new Set(), st = [];
      visitsOn(new Date(S.sel + 'T12:00')).forEach(v => { const c = S.c.find(x => x.id === v.cliente_id); if (c && !seen.has(c.id)) { seen.add(c.id); st.push({ lat: c.lat, lng: c.lng, nombre: c.nombre }); } });
      return ruta(st, 'Recorrido del día · ' + st.length + (st.length === 1 ? ' parada' : ' paradas'), { ordenar: true });
    }
    case 'modo': S.modo = d.id; return trazar();
    case 'cerrarRuta': R = null; rlayer.clearLayers(); return panelRuta();
    case 'asistEnviar': { const x = $('#at').value.trim(); if (!x) return toast('Escribí o dictá qué querés hacer'); return procesar(x); }
    case 'asistOk': {
      t.disabled = true;
      try {
        for (const a of A) {
          if (a.tipo === 'crear_cliente') {
            const g = await geo(a.direccion);
            if (!g) { toast('No encontré la dirección ' + a.direccion + '. Cargalo a mano.'); continue; }
            await put('c', 'clientes', { nombre: a.nombre, direccion: a.direccion, lat: g[0], lng: g[1], telefono: a.telefono || null, notas: a.notas || '', frecuencia: a.frecuencia || 'Semanal', piletero_id: S.me.id });
          } else if (a.tipo === 'programar_visita') {
            const c = S.c.find(x => x.id === a.cliente_id);
            if (!c || !/^\d{4}-\d{2}-\d{2}$/.test(a.fecha || '')) { toast('No pude armar esa visita. Probá desde el calendario.'); continue; }
            await put('v', 'visitas', { cliente_id: c.id, fecha: a.fecha, hora: a.hora || null, repetir: a.repetir || 'no' });
            S.sel = a.fecha;
          } else if (a.tipo === 'agregar_herramienta') {
            await put('h', 'herramientas', a.propia || !isGestor() ? { nombre: a.nombre, estado: 'en_uso', usuario_id: S.me.id, propietario_id: S.me.id } : { nombre: a.nombre, estado: 'disponible' });
          }
        }
        A = []; closeSheet(); renderAll(); return toast('Listo');
      } finally { t.disabled = false; }
    }
    case 'chk': {
      const v = S.v.find(x => x.id === d.id), c = S.c.find(x => x.id === v.cliente_id);
      if (S.sel > ymd(new Date())) return toast('Todavía no llegó ese día');
      const ex = S.r.find(r => r.visita_id === v.id && r.fecha === S.sel);
      if (ex && ex.pago_id) return toast('Esa visita ya está incluida en un pago');
      let nuevo = null;
      if (ex) { if ((ex.nota || ex.productos) && !confirm('Esta visita tiene notas o fotos guardadas. Si la desmarcás se borran. ¿Seguir?')) return; await del('r', 'realizadas', ex.id); toast('Visita desmarcada'); }
      else { nuevo = await put('r', 'realizadas', { visita_id: v.id, cliente_id: c.id, piletero_id: c.piletero_id || S.me.id, fecha: S.sel, valor: +c.valor_visita || 0 }); toast(c.valor_visita ? 'Visita registrada' : 'Visita registrada. Este cliente no tiene valor cargado.'); }
      renderAll(); if (nuevo) abrirRegistro(nuevo.id); return;
    }
    case 'mes': { const x = mesDe(S.mes); x.setMonth(x.getMonth() + (+d.id)); S.mes = ymd(x).slice(0, 7); return renderPerfil(); }
    case 'invtab': S.inv = d.id; return renderInv();
    case 'nuevoP': if (!isGestor()) return toast('Solo el coordinador o la administración cargan productos'); return formProducto();
    case 'editarP': if (!isGestor()) return; return formProducto(S.pr.find(x => x.id === d.id));
    case 'guardarP': {
      if (!isGestor()) return;
      const n = $('#pn').value.trim(); if (!n) return toast('Escribí el nombre');
      const old = S.pr.find(x => x.id === d.id), stock = +$('#ps').value || 0, costo = +$('#pcst').value || 0;
      const f = { nombre: n, detalle: $('#pd').value.trim(), precio: +$('#pp').value || 0, stock_min: +$('#pm').value || 0 };
      t.disabled = true;
      try {
        const pr = old ? await upd('pr', 'productos', old.id, f) : await put('pr', 'productos', { ...f, stock: 0 });
        if (stock !== (old ? +old.stock : 0)) await rpc('ajustar_stock', { p_producto: pr.id, p_tipo: 'ajuste', p_cant: stock, p_nota: old ? 'Corrección manual' : 'Stock inicial' });
        await setCosto(pr.id, costo);
      } finally { t.disabled = false; }
      closeSheet(); renderAll(); return toast('Producto guardado');
    }
    case 'borrarP':
      if (!isGestor()) return;
      if (!confirm('¿Eliminar este producto?')) return;
      await del('pr', 'productos', d.id); closeSheet(); renderAll(); return toast('Producto eliminado');
    case 'nuevoK': if (!isGestor()) return; return formKit();
    case 'editarK': if (!isGestor()) return; return formKit(S.k.find(x => x.id === d.id));
    case 'guardarK': {
      if (!isGestor()) return;
      const n = $('#kn').value.trim(), items = [...document.querySelectorAll('[data-kp]')].map(i => ({ p: i.dataset.kp, n: +i.value || 0 })).filter(i => i.n > 0);
      if (!n || !items.length) return toast('Poné un nombre y al menos un producto');
      await put('k', 'kits', { ...S.k.find(x => x.id === d.id), nombre: n, precio: +$('#kp').value || 0, items });
      closeSheet(); renderAll(); return toast('Kit guardado');
    }
    case 'borrarK':
      if (!isGestor()) return;
      if (!confirm('¿Eliminar este kit?')) return;
      await del('k', 'kits', d.id); closeSheet(); renderAll(); return toast('Kit eliminado');
    case 'venderP': return venta('p', d.id);
    case 'venderK': return venta('k', d.id);
    case 'okVenta': {
      const q = Math.max(1, Math.floor(+$('#vq').value || 1));
      t.disabled = true;
      try { await rpc('vender', { p_tipo: d.tipo, p_item: d.id, p_cant: q, p_cliente: $('#vcl').value || null, p_cobrado: $('#vco').value === 'si' }); } finally { t.disabled = false; }
      closeSheet(); renderAll(); return toast('Venta registrada');
    }
    case 'pagar': {
      const mis = S.r.filter(r => r.piletero_id === S.me.id && !r.pago_id);
      if (!mis.length) return toast('No tenés nada pendiente');
      const t = sumar(mis);
      return sheet(`<h2>Pagar a la empresa</h2><p class="sub">${mis.length} ${mis.length === 1 ? 'visita sin pagar' : 'visitas sin pagar'}</p><p class="note">Vas a registrar que devolviste ${peso(t.emp)} (${100 - PP}% de ${peso(t.t)}). Lo pendiente vuelve a $0 y las visitas quedan guardadas.</p><button class="btn" data-a="okPagar">Confirmar pago</button><button class="btn sec" data-a="cerrar">Cancelar</button>`);
    }
    case 'okPagar': {
      const mis = S.r.filter(r => r.piletero_id === S.me.id && !r.pago_id);
      if (!mis.length) return closeSheet();
      if (sb) {
        const x = await sb.rpc('pagar', { empresa: (100 - PP) / 100 });
        if (x.error) throw new Error(x.error.message);
        const yo = S.me.id; await load(); S.me = P(yo);
      } else {
        const pg = { id: crypto.randomUUID(), piletero_id: S.me.id, fecha: ymd(new Date()), monto: sumar(mis).emp, visitas: mis.length, creado: new Date().toISOString() };
        S.pg.push(pg); mis.forEach(r => { r.pago_id = pg.id; });
      }
      closeSheet(); renderAll(); return toast('Pago registrado');
    }
    case 'reponer': {
      if (!isGestor()) return;
      const p = S.pr.find(x => x.id === d.id);
      return sheet(`<h2>Reponer ${esc(p.nombre)}</h2><p class="sub">Stock actual: ${p.stock}</p><label>Unidades que ingresaron<input id="rq" type="number" inputmode="numeric" min="1" value="1"></label><button class="btn" data-a="okReponer" data-id="${p.id}">Sumar al stock</button>`);
    }
    case 'okReponer': {
      if (!isGestor()) return;
      const n = Math.floor(+$('#rq').value || 0);
      if (n < 1) return toast('Poné cuántas unidades ingresaron');
      t.disabled = true;
      try { await rpc('ajustar_stock', { p_producto: d.id, p_tipo: 'reposicion', p_cant: n, p_nota: null }); } finally { t.disabled = false; }
      closeSheet(); renderAll(); return toast('Stock actualizado');
    }
    case 'porc': {
      if (!isGestor()) return;
      const pl = P(d.id);
      return sheet(`<h2>Comisión de ${esc(pl.nombre)}</h2><p class="sub">Porcentaje del precio de cada producto o kit que vende.</p><label>Porcentaje (%)<input id="pc" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${+pl.porc_productos || 0}"></label><button class="btn" data-a="guardarPorc" data-id="${pl.id}">Guardar</button><p class="sub" style="margin-top:12px">Se aplica a las ventas nuevas. Las anteriores conservan el porcentaje que tenían.</p>`);
    }
    case 'guardarPorc': {
      if (!isGestor()) return;
      const n = Math.min(100, Math.max(0, +$('#pc').value || 0));
      const r = await put('p', 'perfiles', { ...P(d.id), porc_productos: n });
      if (r && d.id === S.me.id) S.me = r;
      closeSheet(); renderAll(); return toast('Comisión guardada');
    }
    case 'verVenta': return verVenta(d.id);
    case 'cobro': {
      const v = S.vt.find(x => x.id === d.id), nuevo = v.cobrado === false;
      await rpc('cobrar_venta', { p_id: d.id, p_cobrado: nuevo });
      closeSheet(); renderAll(); return toast(nuevo ? 'Marcada como cobrada' : 'Marcada como pendiente');
    }
    case 'anular': {
      if (!confirm('¿Anular esta venta? El stock vuelve al inventario.')) return;
      await rpc('anular_venta', { p_id: d.id });
      closeSheet(); renderAll(); return toast('Venta anulada y stock devuelto');
    }
    case 'orden': R.orden = R.orden === 'corto' ? 'dado' : 'corto'; return trazar();
    case 'editarReg': return abrirRegistro(d.id);
    case 'guardarReg': {
      const r = S.r.find(x => x.id === d.id), files = [...($('#rf').files || [])].slice(0, 4);
      t.disabled = true;
      try {
        await upd('r', 'realizadas', r.id, { nota: $('#rn').value.trim() || null, productos: $('#rp').value.trim() || null });
        for (const f of files) await subirFoto(r, f);
      } finally { t.disabled = false; }
      closeSheet(); renderAll(); return toast('Registro guardado');
    }
    case 'hist': {
      const c = S.c.find(x => x.id === d.id);
      sheet(`<h2>Historial · ${esc(c.nombre)}</h2><p class="note">Cargando historial…</p>`);
      await cargarFotos(c.id);
      return sheet(`<h2>Historial · ${esc(c.nombre)}</h2>` + histRows(c, 200, true));
    }
    case 'ventaCli': S.vcl = d.id; S.inv = 'prod'; closeSheet(); go('inv'); renderInv(); return toast('Elegí el producto y tocá Vender');
    case 'cerrar': return closeSheet();
    case 'demo': return start(d.id);
    case 'login': return auth(false);
    case 'registro': return auth(true);
    case 'abrir': return openCliente(d.id);
    case 'mio': {
      const c = S.c.find(x => x.id === d.id);
      await put('c', 'clientes', { ...c, piletero_id: S.me.id });
      closeSheet(); renderAll(); return toast('Ahora es tu cliente');
    }
    case 'nuevoC': return formCliente();
    case 'editarC': return formCliente(S.c.find(x => x.id === d.id));
    case 'guardarC': {
      const c = S.c.find(x => x.id === d.id), n = $('#fn').value.trim(), dir = $('#fd').value.trim();
      if (!n || !dir) return toast('Completá nombre y dirección');
      let g = c && dir === c.direccion ? [c.lat, c.lng] : null;
      if (!g) { t.disabled = true; g = await geo(dir); t.disabled = false; }
      if (!g) return toast('No encontré esa dirección. Probá con calle y número.');
      const saved = await put('c', 'clientes', { ...c, nombre: n, direccion: dir, lat: g[0], lng: g[1], telefono: $('#fl').value.trim(), valor_visita: +$('#fv').value || 0, frecuencia: $('#ff').value, dia: $('#fy').value, notas: $('#ft').value.trim(), piletero_id: $('#fp') ? $('#fp').value : (c?.piletero_id || S.me.id) });
      const dia = $('#fy').value, fr = $('#ff').value;
      if (saved && DN.includes(dia) && (fr === 'Semanal' || fr === 'Cada 15 días') && !S.v.some(v => v.cliente_id === saved.id)) {
        const t2 = new Date(); t2.setDate(t2.getDate() + ((DN.indexOf(dia) - t2.getDay() + 7) % 7));
        await put('v', 'visitas', { cliente_id: saved.id, fecha: ymd(t2), hora: null, repetir: fr === 'Semanal' ? 'semanal' : 'quincenal' });
      }
      closeSheet(); renderAll(); return toast('Cliente guardado');
    }
    case 'borrarC': {
      if (!confirm('¿Eliminar este cliente?')) return;
      if (sb) { const x = await sb.from('clientes').delete().eq('id', d.id); if (x.error) return toast(x.error.message); }
      S.c = S.c.filter(x => x.id !== d.id); S.v = S.v.filter(x => x.cliente_id !== d.id); S.h.forEach(x => { if (x.cliente_id === d.id) x.cliente_id = null; });
      closeSheet(); renderAll(); return toast('Cliente eliminado');
    }
    case 'usar':
      return sheet(`<h2>${esc(h.nombre)}</h2><p class="sub">¿En qué cliente la vas a usar?</p><select id="hc"><option value="">Sin cliente (la llevo yo)</option>${S.c.map(c => `<option value="${c.id}">${esc(c.nombre)} — ${esc(c.direccion)}</option>`).join('')}</select><button class="btn" data-a="okUsar" data-id="${h.id}">Marcar en uso</button>`);
    case 'okUsar':
      await put('h', 'herramientas', { ...h, estado: 'en_uso', cliente_id: $('#hc').value || null, usuario_id: S.me.id });
      closeSheet(); renderAll(); return toast('Marcada en uso');
    case 'devolver':
      await put('h', 'herramientas', { ...h, estado: 'disponible', cliente_id: null, usuario_id: null });
      renderAll(); return toast('Devuelta al depósito');
    case 'nuevaH':
      if (!isGestor()) return toast('Solo el coordinador o la administración agregan herramientas de la empresa');
      return sheet('<h2>Nueva herramienta</h2><label>Nombre<input id="hn" placeholder="Ej: Bomba de achique"></label><button class="btn" data-a="guardarH">Guardar herramienta</button>');
    case 'guardarH': {
      if (!isGestor()) return;
      const n = $('#hn').value.trim(); if (!n) return toast('Escribí el nombre');
      await put('h', 'herramientas', { nombre: n, estado: 'disponible' });
      closeSheet(); renderAll(); return toast('Herramienta guardada');
    }
    case 'color':
      S.me = await put('p', 'perfiles', { ...S.me, color: d.id }) || S.me; return renderAll();
    case 'salir':
      await stopShare(); return sb ? sb.auth.signOut().then(() => location.reload()) : location.reload();
  }
}
$('#q').addEventListener('input', renderClients);
// Sin zoom con dos dedos en la app; solo el mapa lo permite
['gesturestart', 'gesturechange', 'gestureend'].forEach(ev => document.addEventListener(ev, e => { if (!e.target.closest('#map')) e.preventDefault(); }, { passive: false }));
document.addEventListener('touchmove', e => { if (e.touches.length > 1 && !e.target.closest('#map')) e.preventDefault(); }, { passive: false });
setInterval(() => { if (!document.hidden) pollU(); }, 20000);
document.addEventListener('change', e => {
  if (e.target.id !== 'foto' || !e.target.files[0]) return;
  const img = new Image();
  img.onload = async () => {
    const z = 192, cv = document.createElement('canvas'), m = Math.min(img.width, img.height);
    cv.width = cv.height = z;
    cv.getContext('2d').drawImage(img, (img.width - m) / 2, (img.height - m) / 2, m, m, 0, 0, z, z);
    try { S.me = await put('p', 'perfiles', { ...S.me, foto: cv.toDataURL('image/jpeg', .8) }) || S.me; renderAll(); toast('Foto actualizada'); } catch (err) { toast(err.message); }
  };
  img.src = URL.createObjectURL(e.target.files[0]);
});

// ── Arranque
(async () => {
  if (sb) {
    const { data } = await sb.auth.getSession();
    if (data.session) return start(data.session.user);
  } else demo();
  authUI();
})();
</script>
</body>
</html>
